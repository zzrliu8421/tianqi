<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SkyWeather · 云际天气</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =====================================================
           设计令牌 Design Tokens
           ===================================================== */
        :root {
            --white: #ffffff;
            --black: #0b0f19;

            --bg-base: #0b0f19;
            --bg-surface: #111827;
            --bg-elevated: #1a2332;

            --glass-1: rgba(255, 255, 255, 0.06);
            --glass-2: rgba(255, 255, 255, 0.10);
            --glass-3: rgba(255, 255, 255, 0.14);
            --glass-4: rgba(255, 255, 255, 0.20);

            --border-1: rgba(255, 255, 255, 0.08);
            --border-2: rgba(255, 255, 255, 0.12);
            --border-3: rgba(255, 255, 255, 0.18);

            --text-primary: #f8fafc;
            --text-secondary: rgba(248, 250, 252, 0.72);
            --text-tertiary: rgba(248, 250, 252, 0.50);
            --text-muted: rgba(248, 250, 252, 0.32);

            --accent: #38bdf8;
            --accent-2: #818cf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);

            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;

            --r-2xs: 6px;
            --r-xs: 8px;
            --r-sm: 12px;
            --r-md: 16px;
            --r-lg: 20px;
            --r-xl: 24px;
            --r-2xl: 28px;
            --r-pill: 9999px;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;

            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --dur-fast: 0.15s;
            --dur-normal: 0.25s;
            --dur-slow: 0.4s;
            --dur-enter: 0.6s;

            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", "WenQuanYi Micro Hei", system-ui, sans-serif;
            --font-mono: ui-monospace, "SF Mono", Consolas, "Microsoft YaHei", monospace;

            --fs-xs: 0.75rem;
            --fs-sm: 0.875rem;
            --fs-base: 1rem;
            --fs-lg: 1.125rem;
            --fs-xl: 1.25rem;
            --fs-2xl: 1.5rem;
            --fs-3xl: clamp(1.75rem, 4vw, 2.25rem);
            --fs-display: clamp(3rem, 9vw, 5.5rem);

            --content-max: 1100px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --overlay-bg: rgba(17, 24, 39, 0.98);
            --overlay-bg-light: rgba(17, 24, 39, 0.95);
        }

        /* 天气主题 */
        .theme-sunny {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-elevated: #334155;
            --accent: #fbbf24;
            --accent-2: #f97316;
            --accent-glow: rgba(251, 191, 36, 0.40);
            --accent-gradient: linear-gradient(135deg, #fbbf24 0%, #f97316 100%);
        }
        .theme-cloudy {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-elevated: #334155;
            --accent: #94a3b8;
            --accent-2: #cbd5e1;
            --accent-glow: rgba(148, 163, 184, 0.35);
            --accent-gradient: linear-gradient(135deg, #94a3b8 0%, #cbd5e1 100%);
        }
        .theme-rain {
            --bg-base: #0b1220;
            --bg-surface: #162032;
            --bg-elevated: #243049;
            --accent: #60a5fa;
            --accent-2: #38bdf8;
            --accent-glow: rgba(96, 165, 250, 0.40);
            --accent-gradient: linear-gradient(135deg, #60a5fa 0%, #38bdf8 100%);
        }
        .theme-snow {
            --bg-base: #1e293b;
            --bg-surface: #334155;
            --bg-elevated: #475569;
            --text-primary: #f1f5f9;
            --text-secondary: rgba(241, 245, 249, 0.75);
            --text-tertiary: rgba(241, 245, 249, 0.55);
            --text-muted: rgba(241, 245, 249, 0.35);
            --glass-1: rgba(255, 255, 255, 0.10);
            --glass-2: rgba(255, 255, 255, 0.16);
            --glass-3: rgba(255, 255, 255, 0.22);
            --glass-4: rgba(255, 255, 255, 0.30);
            --border-1: rgba(255, 255, 255, 0.12);
            --border-2: rgba(255, 255, 255, 0.18);
            --border-3: rgba(255, 255, 255, 0.26);
            --accent: #e2e8f0;
            --accent-2: #ffffff;
            --accent-glow: rgba(226, 232, 240, 0.45);
            --accent-gradient: linear-gradient(135deg, #e2e8f0 0%, #ffffff 100%);
        }
        .theme-storm {
            --bg-base: #050510;
            --bg-surface: #0f0f1a;
            --bg-elevated: #1a1a2e;
            --accent: #a78bfa;
            --accent-2: #c4b5fd;
            --accent-glow: rgba(167, 139, 250, 0.50);
            --accent-gradient: linear-gradient(135deg, #a78bfa 0%, #c4b5fd 100%);
        }
        .theme-fog {
            --bg-base: #1e293b;
            --bg-surface: #334155;
            --bg-elevated: #475569;
            --text-primary: #f1f5f9;
            --text-secondary: rgba(241, 245, 249, 0.72);
            --text-tertiary: rgba(241, 245, 249, 0.50);
            --text-muted: rgba(241, 245, 249, 0.30);
            --glass-1: rgba(255, 255, 255, 0.08);
            --glass-2: rgba(255, 255, 255, 0.14);
            --glass-3: rgba(255, 255, 255, 0.20);
            --border-1: rgba(255, 255, 255, 0.10);
            --border-2: rgba(255, 255, 255, 0.16);
            --border-3: rgba(255, 255, 255, 0.24);
            --accent: #cbd5e1;
            --accent-2: #e2e8f0;
            --accent-glow: rgba(203, 213, 225, 0.35);
            --accent-gradient: linear-gradient(135deg, #cbd5e1 0%, #e2e8f0 100%);
        }
        .theme-haze {
            --bg-base: #1c1917;
            --bg-surface: #292524;
            --bg-elevated: #44403c;
            --accent: #fdba74;
            --accent-2: #fb923c;
            --accent-glow: rgba(253, 186, 116, 0.40);
            --accent-gradient: linear-gradient(135deg, #fdba74 0%, #fb923c 100%);
        }

        /* AQI 主题覆盖 */
        .aqi-good { --aqi-color: #34d399; --aqi-glow: rgba(52, 211, 153, 0.35); }
        .aqi-moderate { --aqi-color: #fbbf24; --aqi-glow: rgba(251, 191, 36, 0.35); }
        .aqi-unhealthy-sensitive { --aqi-color: #fb923c; --aqi-glow: rgba(251, 146, 60, 0.35); }
        .aqi-unhealthy { --aqi-color: #f87171; --aqi-glow: rgba(248, 113, 113, 0.35); }
        .aqi-very-unhealthy { --aqi-color: #a78bfa; --aqi-glow: rgba(167, 139, 250, 0.35); }
        .aqi-hazardous { --aqi-color: #881337; --aqi-glow: rgba(136, 19, 55, 0.35); }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
            background-color: var(--bg-base);
            overscroll-behavior: none;
        }

        body {
            font-family: var(--font-sans);
            /* 仅保留纯色兜底；渐变与背景图由 body::before 固定层承载，
               避免地址栏变化时 background-attachment: fixed 在移动端的跳动问题 */
            background-color: var(--bg-base);
            color: var(--text-primary);
            overflow-x: hidden;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
            min-height: 100dvh;
            transition: background-color 1s var(--ease);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.5;
        }

        /* 主背景层 —— fixed 定位，不随滚动和地址栏显示/隐藏而变化 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 20%, var(--bg-elevated), transparent 50%),
                radial-gradient(ellipse 70% 50% at 80% 80%, var(--bg-surface), transparent 50%),
                linear-gradient(180deg, var(--bg-base) 0%, var(--bg-surface) 100%);
            pointer-events: none;
            z-index: 0;
            transition: background 1s var(--ease);
        }

        /* 背景图叠加（有背景图时替换主背景层） */
        body.has-bg-image::before {
            background-image:
                linear-gradient(180deg, rgba(11, 15, 25, 0.78) 0%, rgba(11, 15, 25, 0.88) 100%),
                var(--bg-image, none),
                radial-gradient(ellipse 80% 60% at 20% 20%, var(--bg-elevated), transparent 50%),
                radial-gradient(ellipse 70% 50% at 80% 80%, var(--bg-surface), transparent 50%),
                linear-gradient(180deg, var(--bg-base) 0%, var(--bg-surface) 100%);
            background-size: cover, cover, auto, auto, auto;
            background-position: center, center, center, center, center;
            background-repeat: no-repeat;
        }

        /* accent-glow 装饰层 —— 固定，叠加在主背景之上 */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 25% 25%, var(--accent-glow), transparent 35%),
                radial-gradient(circle at 75% 75%, var(--accent-glow), transparent 35%);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
            transition: opacity 1s var(--ease), background 1s var(--ease);
        }

        body.has-bg-image::after {
            opacity: 0.12;
        }

        button, input {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
            outline: none;
        }
        button { cursor: pointer; }

        /* Canvas */
        #weather-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.8;
            transition: opacity 0.6s var(--ease);
            will-change: transform;
        }
        @media (prefers-reduced-motion: reduce) {
            #weather-canvas { display: none; }
        }

        .app {
            position: relative;
            z-index: 2;
            max-width: var(--content-max);
            margin: 0 auto;
            padding: calc(var(--space-6) + var(--safe-top)) var(--space-4) var(--space-4);
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
        }

        /* 顶栏 */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            transform: translateY(-12px);
            animation: fadeInDown 0.7s var(--ease-out) 0.1s forwards;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-weight: 700;
            font-size: var(--fs-lg);
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-gradient);
            box-shadow: 0 0 14px var(--accent-glow);
            animation: pulse-glow 2.5s ease-in-out infinite;
        }

        .topbar-meta {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-1) var(--space-3);
            background: var(--glass-1);
            border: 1px solid var(--border-1);
            border-radius: var(--r-pill);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            font-size: var(--fs-xs);
            color: var(--text-secondary);
            transition: all var(--dur-normal) var(--ease);
        }

        .badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .badge.ipv6 .dot {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* 搜索 */
        .search {
            display: flex;
            gap: var(--space-2);
            position: relative;
            z-index: 100;
            opacity: 0;
            transform: translateY(16px);
            animation: fadeInUp 0.7s var(--ease-out) 0.18s forwards;
        }

        .search-box { flex: 1; position: relative; z-index: 101; }

        .search-input {
            width: 100%;
            height: 52px;
            padding: 0 var(--space-10) 0 3rem;
            border: 1px solid var(--border-2);
            border-radius: var(--r-lg);
            background: var(--glass-2);
            color: var(--text-primary);
            font-size: var(--fs-base);
            outline: none;
            transition: all var(--dur-normal) var(--ease);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
        }

        .search-input::placeholder { color: var(--text-tertiary); }
        .search-input:hover { background: var(--glass-3); border-color: var(--border-3); }
        .search-input:focus {
            border-color: var(--accent);
            background: var(--glass-3);
            box-shadow: 0 0 0 4px var(--accent-glow), 0 12px 32px rgba(0, 0, 0, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            transition: color var(--dur-normal) var(--ease);
            display: flex;
            pointer-events: none;
        }
        .search-input:focus ~ .search-icon { color: var(--accent); }

        .search-shortcut {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            padding: var(--space-1) var(--space-2);
            background: var(--glass-3);
            border: 1px solid var(--border-2);
            border-radius: var(--r-xs);
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            transition: opacity var(--dur-normal) var(--ease);
            pointer-events: none;
        }
        .search-input:focus ~ .search-shortcut { opacity: 0; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            height: 52px;
            padding: 0 var(--space-5);
            border-radius: var(--r-lg);
            font-size: var(--fs-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--dur-normal) var(--ease);
            white-space: nowrap;
            user-select: none;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: var(--white);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px var(--accent-glow), 0 0 0 1px rgba(255, 255, 255, 0.15) inset; }
        .btn-primary:active { transform: translateY(0) scale(0.97); }

        .btn-ghost {
            width: 52px;
            height: 52px;
            padding: 0;
            background: var(--glass-2);
            color: var(--text-secondary);
            border: 1px solid var(--border-2);
        }
        .btn-ghost:hover { background: var(--glass-3); color: var(--text-primary); transform: translateY(-2px); border-color: var(--border-3); }
        .btn-ghost:active { transform: translateY(0) scale(0.97); }
        .btn-ghost.spinning svg { animation: spin 0.8s linear infinite; }
        .btn-ghost.active { background: var(--accent-gradient); color: var(--white); border-color: transparent; box-shadow: 0 4px 16px var(--accent-glow); }

        /* 历史下拉 */
        .history {
            position: absolute;
            top: calc(100% + var(--space-2));
            left: 0;
            right: 0;
            background: var(--overlay-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--border-2);
            border-radius: var(--r-lg);
            padding: var(--space-2);
            z-index: 9999;
            display: none;
            max-height: 260px;
            overflow-y: auto;
            overscroll-behavior: contain;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.55);
            pointer-events: auto;
        }
        .history.show { display: block; animation: scaleIn 0.25s var(--ease-spring); transform-origin: top center; }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-2) var(--space-3);
            font-size: var(--fs-xs);
            color: var(--text-tertiary);
        }

        .history-clear {
            color: var(--text-tertiary);
            font-size: var(--fs-xs);
            padding: var(--space-1) var(--space-2);
            border-radius: var(--r-xs);
            transition: all var(--dur-fast) var(--ease);
        }
        .history-clear:hover { color: var(--danger); background: rgba(248, 113, 113, 0.12); }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-3);
            border-radius: var(--r-md);
            cursor: pointer;
            font-size: var(--fs-sm);
            color: var(--text-secondary);
            transition: all var(--dur-fast) var(--ease);
        }
        .history-item:hover { background: var(--glass-3); color: var(--text-primary); transform: translateX(4px); }
        .history-item .h-label { display: flex; align-items: center; gap: var(--space-2); }
        .history-item .h-label svg { width: 16px; height: 16px; color: var(--accent); }
        .history-item .h-remove {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            border-radius: 50%;
            transition: all var(--dur-fast) var(--ease);
            opacity: 0;
        }
        .history-item .h-remove svg { width: 14px; height: 14px; }
        .history-item:hover .h-remove { opacity: 1; }
        .history-item .h-remove:hover { color: var(--danger); background: rgba(248, 113, 113, 0.15); }

        /* 玻璃卡片 */
        .glass {
            background: var(--glass-2);
            border: 1px solid var(--border-2);
            border-radius: var(--r-xl);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: all var(--dur-slow) var(--ease);
        }
        @supports not (backdrop-filter: blur(1px)) {
            .glass { background: rgba(17, 24, 39, 0.92); }
        }
        .glass:hover {
            border-color: var(--border-3);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .glass-strong { background: var(--glass-3); border-color: var(--border-3); }

        /* 主体网格 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-5);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.7s var(--ease-out) 0.26s forwards;
        }

        /* 当前天气主卡 */
        .current-card {
            grid-column: 1;
            padding: var(--space-6);
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            position: relative;
            overflow: hidden;
            min-width: 0;
        }
        .current-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: min(400px, 80%);
            height: min(400px, 80%);
            background: radial-gradient(circle, var(--accent-glow), transparent 60%);
            opacity: 0.4;
            pointer-events: none;
            animation: aura-drift 12s ease-in-out infinite;
        }

        .current-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: var(--space-3);
            position: relative;
            z-index: 1;
            min-width: 0;
        }

        .location { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; flex: 1; }
        .location-city {
            font-size: var(--fs-3xl);
            font-weight: 700;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: var(--space-2);
            color: var(--text-primary);
            flex-wrap: wrap;
            row-gap: var(--space-1);
            min-width: 0;
        }
        .location-city > span:first-child {
            word-break: keep-all;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .location-meta {
            font-size: var(--fs-sm);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            flex-wrap: wrap;
        }
        .location-meta svg { width: 14px; height: 14px; }

        .provider-badge, .ipv6-badge, .country-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            background: var(--glass-3);
            border: 1px solid var(--border-2);
            border-radius: var(--r-pill);
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .provider-badge svg, .ipv6-badge svg, .country-badge svg {
            width: 10px;
            height: 10px;
            flex-shrink: 0;
        }
        .provider-badge { color: var(--accent); }
        .ipv6-badge { color: var(--success); border-color: rgba(52, 211, 153, 0.25); }
        .ipv6-badge .ipv6-text { display: none; }
        .country-badge { text-transform: uppercase; }

        .weather-icon-wrap {
            position: relative;
            width: clamp(72px, 15vw, 140px);
            height: clamp(72px, 15vw, 140px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .weather-icon-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, var(--accent-glow), transparent 65%);
            border-radius: 50%;
            animation: aura-pulse 4s ease-in-out infinite;
        }
        .weather-icon-wrap svg {
            position: relative;
            z-index: 1;
            width: 75%;
            height: 75%;
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.2));
            box-sizing: border-box;
        }

        .current-temp {
            display: flex;
            align-items: flex-start;
            gap: var(--space-1);
            position: relative;
            z-index: 1;
        }
        .temp-value {
            font-size: var(--fs-display);
            font-weight: 200;
            line-height: 0.95;
            letter-spacing: -0.05em;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(180deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .temp-unit {
            font-size: clamp(1.25rem, 3vw, 2rem);
            color: var(--text-secondary);
            font-weight: 300;
            margin-top: var(--space-2);
        }

        .current-desc {
            font-size: var(--fs-lg);
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: var(--space-2);
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        .current-feel {
            font-size: var(--fs-sm);
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
            margin-top: calc(var(--space-1) * -1);
        }

        .current-range {
            margin-top: var(--space-2);
            position: relative;
            z-index: 1;
        }
        .current-range .range-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }
        .current-range .range-low,
        .current-range .range-high {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: var(--fs-sm);
            font-weight: 600;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .current-range .range-low { color: #60a5fa; }
        .current-range .range-low svg { width: 12px; height: 12px; }
        .current-range .range-high { color: #f87171; }
        .current-range .range-high svg { width: 12px; height: 12px; }
        .current-range .range-desc {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: var(--space-2);
            text-align: center;
        }

        .comfor-bar {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-1) var(--space-3);
            background: var(--glass-3);
            border: 1px solid var(--border-2);
            border-radius: var(--r-pill);
            font-size: var(--fs-xs);
            font-weight: 500;
            color: var(--text-secondary);
        }
        .comfor-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }
        .comfor-dot.warm { background: var(--warning); }
        .comfor-dot.hot { background: var(--danger); }
        .comfor-dot.cold { background: var(--accent); }

        .temp-range {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-top: var(--space-2);
            color: var(--text-secondary);
            font-size: var(--fs-sm);
            position: relative;
            z-index: 1;
        }
        .temp-bar {
            flex: 1;
            max-width: 220px;
            height: 6px;
            background: var(--glass-3);
            border-radius: var(--r-pill);
            position: relative;
            overflow: visible;
        }
        .temp-bar-fill {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(90deg, #60a5fa, var(--accent), #f87171);
            border-radius: var(--r-pill);
            transform-origin: left;
            animation: bar-grow 1s var(--ease-out) forwards;
        }
        .temp-bar-current {
            position: absolute;
            top: 50%;
            width: 10px;
            height: 10px;
            background: var(--text-primary);
            border: 2px solid var(--bg-surface);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px var(--accent-glow);
            z-index: 2;
        }

        /* 详情网格 */
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-3);
            position: relative;
            z-index: 1;
        }

        .detail-card {
            background: var(--glass-1);
            border: 1px solid var(--border-1);
            border-radius: var(--r-lg);
            padding: var(--space-3);
            transition: all var(--dur-normal) var(--ease);
            position: relative;
            overflow: hidden;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .detail-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            opacity: 0.3;
            transition: left 0.8s var(--ease);
        }
        .detail-card:hover { background: var(--glass-2); transform: translateY(-3px); border-color: var(--border-2); }
        .detail-card:hover::before { left: 100%; }
        .detail-card .dc-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-3);
            border: 1px solid var(--border-2);
            border-radius: var(--r-md);
            margin-bottom: var(--space-2);
            color: var(--accent);
            transition: all var(--dur-normal) var(--ease);
        }
        .detail-card:hover .dc-icon { transform: scale(1.1); background: var(--glass-4); }
        .detail-card .dc-icon svg { width: 18px; height: 18px; }
        .detail-card .dc-value {
            font-size: var(--fs-base);
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: var(--space-1);
            flex-wrap: wrap;
        }
        .detail-card .dc-label {
            font-size: var(--fs-xs);
            color: var(--text-tertiary);
            margin-top: var(--space-1);
        }
        .detail-card .dc-extra {
            font-size: var(--fs-xs);
            color: var(--text-secondary);
            margin-top: var(--space-2);
            display: flex;
            align-items: center;
            gap: var(--space-1);
            font-weight: 500;
        }
        .detail-card .dc-bar {
            flex: 1;
            height: 3px;
            background: var(--glass-3);
            border-radius: var(--r-pill);
            overflow: hidden;
            margin-top: var(--space-3);
        }
        .detail-card .dc-bar-fill {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: var(--r-pill);
            transition: width 1s var(--ease-out);
        }

        /* AQI 卡片 */
        .aqi-card {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: var(--space-4);
            padding: var(--space-3) var(--space-4);
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
            border: 1px solid var(--border-2);
            border-radius: var(--r-lg);
            position: relative;
            overflow: hidden;
            transition: all var(--dur-normal) var(--ease);
            min-width: 0;
        }
        .aqi-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 90% 50%, var(--aqi-glow, transparent), transparent 60%);
            opacity: 0.6;
            pointer-events: none;
        }
        .aqi-ring {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .aqi-ring svg { transform: rotate(-90deg); }
        .aqi-ring .track { fill: none; stroke: var(--glass-3); stroke-width: 6; }
        .aqi-ring .progress {
            fill: none;
            stroke: var(--aqi-color, var(--text-secondary));
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 176;
            stroke-dashoffset: 176;
            transition: stroke-dashoffset 1s var(--ease-out);
        }
        .aqi-ring-text {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: var(--fs-lg);
            color: var(--aqi-color, var(--text-primary));
        }
        .aqi-ring-text small {
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-tertiary);
        }
        .aqi-info { flex: 1; position: relative; z-index: 1; }
        .aqi-info .aqi-level {
            font-size: var(--fs-lg);
            font-weight: 600;
            color: var(--aqi-color, var(--text-primary));
            margin-bottom: var(--space-1);
        }
        .aqi-info .aqi-desc {
            font-size: var(--fs-xs);
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .aqi-pollutants {
            display: flex;
            gap: var(--space-3);
            margin-top: var(--space-2);
            flex-wrap: wrap;
        }
        .aqi-pollutant {
            font-size: var(--fs-xs);
            color: var(--text-tertiary);
        }
        .aqi-pollutant strong {
            color: var(--text-secondary);
            font-weight: 600;
            margin-left: var(--space-1);
        }

        /* 左右列容器 */
        .main-left { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
        .main-right { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }

        /* 右侧栏 */
        .side-col { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-4);
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--fs-sm);
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }
        .section-title svg { width: 16px; height: 16px; color: var(--accent); }
        .section-action {
            font-size: var(--fs-xs);
            color: var(--text-tertiary);
            padding: var(--space-1) var(--space-3);
            border-radius: var(--r-pill);
            background: var(--glass-1);
            border: 1px solid var(--border-1);
            transition: all var(--dur-fast) var(--ease);
        }
        .section-action:hover { color: var(--text-primary); background: var(--glass-2); }

        .reveal {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            animation: fadeInUp 0.6s var(--ease-out) forwards;
        }
        .reveal.d1 { animation-delay: 0.35s; }
        .reveal.d2 { animation-delay: 0.45s; }
        .reveal.d3 { animation-delay: 0.55s; }
        .reveal.d4 { animation-delay: 0.65s; }
        .reveal.d5 { animation-delay: 0.75s; }

        /* 面板 */
        .panel { padding: var(--space-5); }

        /* 小时预报 */
        .hourly-scroll {
            display: flex;
            gap: var(--space-3);
            overflow-x: auto;
            padding: var(--space-1) var(--space-1) var(--space-4);
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
            scrollbar-color: var(--glass-3) transparent;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
        }
        .hourly-scroll:active { cursor: grabbing; }
        .hourly-scroll::-webkit-scrollbar { height: 4px; }
        .hourly-scroll::-webkit-scrollbar-track { background: transparent; }
        .hourly-scroll::-webkit-scrollbar-thumb { background: var(--glass-3); border-radius: 2px; }
        .hourly-scroll::-webkit-scrollbar-thumb:hover { background: var(--glass-4); }

        .hour-card {
            flex: 0 0 auto;
            min-width: 76px;
            padding: var(--space-4) var(--space-3);
            background: var(--glass-1);
            border: 1px solid var(--border-1);
            border-radius: var(--r-lg);
            text-align: center;
            scroll-snap-align: start;
            transition: all var(--dur-normal) var(--ease);
            cursor: pointer;
            position: relative;
        }
        .hour-card:hover { background: var(--glass-2); transform: translateY(-3px); border-color: var(--border-2); }
        .hour-card.now { background: var(--glass-3); border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
        .hour-card.now .h-time { color: var(--accent); font-weight: 600; }
        .hour-card .h-time {
            font-size: var(--fs-xs);
            color: var(--text-tertiary);
            margin-bottom: var(--space-2);
            font-variant-numeric: tabular-nums;
        }
        .hour-card .h-icon {
            width: 32px;
            height: 32px;
            margin: var(--space-2) auto;
            color: var(--accent);
        }
        .hour-card .h-temp {
            font-size: var(--fs-sm);
            font-weight: 600;
            margin-top: var(--space-2);
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }
        .hour-card .h-pop {
            font-size: 0.65rem;
            color: var(--accent);
            margin-top: 2px;
            font-weight: 600;
        }
        .hour-card .h-pop:empty { display: none; }

        /* 多日预报 */
        .forecast-list { display: flex; flex-direction: column; gap: var(--space-2); }
        .forecast-item {
            display: grid;
            grid-template-columns: 56px 36px 1fr auto;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-4);
            background: var(--glass-1);
            border: 1px solid var(--border-1);
            border-radius: var(--r-md);
            transition: all var(--dur-normal) var(--ease);
            min-width: 0;
        }
        .forecast-item:hover { background: var(--glass-2); transform: translateX(4px); border-color: var(--border-2); }
        .forecast-item .f-day {
            font-size: var(--fs-sm);
            font-weight: 600;
            color: var(--text-primary);
        }
        .forecast-item .f-day small {
            display: block;
            font-size: var(--fs-xs);
            color: var(--text-tertiary);
            font-weight: 400;
            margin-top: 2px;
        }
        .forecast-item .f-icon { display: flex; align-items: center; justify-content: center; color: var(--accent); }
        .forecast-item .f-icon svg { width: 28px; height: 28px; }
        .forecast-item .f-desc {
            font-size: var(--fs-sm);
            color: var(--text-secondary);
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .forecast-item .f-pop {
            font-size: 0.7rem;
            color: var(--accent);
            margin-top: 2px;
        }
        .forecast-item .f-temps {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--fs-sm);
            font-variant-numeric: tabular-nums;
        }
        .forecast-item .f-temp-low { color: var(--text-tertiary); }
        .forecast-item .f-temp-high { color: var(--text-primary); font-weight: 600; }
        .forecast-item .f-bar {
            grid-column: 1 / -1;
            height: 4px;
            background: var(--glass-3);
            border-radius: var(--r-pill);
            position: relative;
            overflow: hidden;
        }
        .forecast-item .f-bar-fill {
            position: absolute;
            top: 0;
            bottom: 0;
            background: linear-gradient(90deg, #60a5fa, var(--accent), #f87171);
            border-radius: var(--r-pill);
            transition: all 0.8s var(--ease-out);
        }

        /* 生活建议（独立卡片，左栏第二行） */
        .life-tips-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-3);
        }
        .life-tip-card {
            background: var(--glass-1);
            border: 1px solid var(--border-1);
            border-radius: var(--r-lg);
            padding: var(--space-4);
            transition: all var(--dur-normal) var(--ease);
            position: relative;
            overflow: hidden;
            min-width: 0;
        }
        .life-tip-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            opacity: 0.2;
            transition: left 0.8s var(--ease);
        }
        .life-tip-card:hover { background: var(--glass-2); transform: translateY(-3px); border-color: var(--border-2); }
        .life-tip-card:hover::before { left: 100%; }
        .life-tip-card .lt-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-3);
            border: 1px solid var(--border-2);
            border-radius: var(--r-md);
            margin-bottom: var(--space-3);
            color: var(--accent);
            transition: all var(--dur-normal) var(--ease);
            font-size: 18px;
        }
        .life-tip-card:hover .lt-icon { transform: scale(1.1); background: var(--glass-4); }
        .life-tip-card .lt-title {
            font-size: var(--fs-xs);
            color: var(--text-tertiary);
            margin-bottom: var(--space-1);
            font-weight: 500;
        }
        .life-tip-card .lt-value {
            font-size: var(--fs-sm);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-1);
        }
        .life-tip-card .lt-desc {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            line-height: 1.4;
        }

        /* 日出日落弧线模块 */
        .sun-arc-panel { padding: var(--space-5); }
        .sun-arc-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
        .sun-arc-svg { width: 100%; max-width: 280px; height: auto; }
        .sun-arc-labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: var(--space-4);
        }
        .sun-arc-item {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        .sun-arc-icon { display: flex; color: var(--accent); }
        .sun-arc-icon svg { width: 20px; height: 20px; }
        .sun-arc-time { font-size: var(--fs-base); font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
        .sun-arc-text { font-size: var(--fs-xs); color: var(--text-tertiary); }

        /* 加载 / 空 / 错 */
        .skeleton-card {
            padding: var(--space-6);
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
            align-self: start;
        }
        .sk {
            background: linear-gradient(105deg, var(--glass-1) 0%, var(--glass-3) 50%, var(--glass-1) 100%);
            background-size: 200% 100%;
            border-radius: var(--r-md);
            animation: shimmer 1.5s ease-in-out infinite;
        }
        .sk-circle { width: 96px; height: 96px; border-radius: 50%; }
        .sk-line { height: 16px; }
        .sk-line.lg { height: 56px; width: 45%; }
        .sk-line.sm { width: 30%; height: 12px; }
        .sk-line.md { width: 65%; }

        .empty {
            text-align: center;
            padding: var(--space-12) var(--space-6);
            color: var(--text-secondary);
        }
        .empty-icon {
            width: 88px;
            height: 88px;
            margin: 0 auto var(--space-5);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-2);
            border: 1px solid var(--border-2);
            border-radius: 50%;
            color: var(--accent);
            animation: float 4s ease-in-out infinite;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        .empty-icon svg { width: 48px; height: 48px; }
        .empty h3 { font-size: var(--fs-xl); margin-bottom: var(--space-2); color: var(--text-primary); font-weight: 600; }
        .empty p { font-size: var(--fs-sm); color: var(--text-tertiary); margin-bottom: var(--space-5); max-width: 320px; margin-left: auto; margin-right: auto; }
        .quick-cities {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            justify-content: center;
            margin-top: var(--space-4);
        }
        .quick-city {
            padding: var(--space-2) var(--space-4);
            background: var(--glass-1);
            border: 1px solid var(--border-1);
            border-radius: var(--r-pill);
            color: var(--text-secondary);
            font-size: var(--fs-xs);
            font-weight: 500;
            transition: all var(--dur-normal) var(--ease);
        }
        .quick-city:hover {
            background: var(--glass-3);
            color: var(--text-primary);
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }

        .error {
            text-align: center;
            padding: var(--space-8) var(--space-6);
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.25);
            border-radius: var(--r-xl);
        }
        .error .err-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--space-4);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(248, 113, 113, 0.15);
            border-radius: 50%;
            color: var(--danger);
            animation: shake 0.5s ease-in-out;
        }
        .error h3 { color: var(--danger); font-size: var(--fs-lg); margin-bottom: var(--space-2); font-weight: 600; }
        .error p { color: var(--text-secondary); font-size: var(--fs-sm); margin-bottom: var(--space-5); }
        .error button {
            padding: var(--space-3) var(--space-5);
            background: var(--danger);
            color: var(--white);
            border-radius: var(--r-pill);
            font-size: var(--fs-sm);
            font-weight: 600;
            transition: all var(--dur-normal) var(--ease);
            box-shadow: 0 4px 14px rgba(248, 113, 113, 0.35);
        }
        .error button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(248, 113, 113, 0.45); }
        .error button:active { transform: translateY(0) scale(0.97); }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-12) var(--space-6);
            gap: var(--space-4);
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border-2);
            border-top-color: var(--accent);
            border-right-color: var(--accent-2);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-text {
            color: var(--text-secondary);
            font-size: var(--fs-sm);
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }
        .loading-dots::after {
            content: '...';
            display: inline-block;
            width: 1.5em;
            text-align: left;
            animation: dots 1.4s steps(4) infinite;
        }

        /* Toast */
        .toast-stack {
            position: fixed;
            top: calc(var(--space-4) + var(--safe-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            pointer-events: none;
            width: min(90vw, 360px);
        }
        .toast {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-4);
            background: var(--overlay-bg-light);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text-primary);
            border: 1px solid var(--border-2);
            border-radius: var(--r-pill);
            font-size: var(--fs-sm);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
            animation: toastIn 0.35s var(--ease-spring);
            pointer-events: auto;
        }
        .toast.success { border-color: rgba(52, 211, 153, 0.35); }
        .toast.error { border-color: rgba(248, 113, 113, 0.35); }
        .toast.removing { animation: toastOut 0.3s var(--ease) forwards; }
        .toast .t-icon { display: flex; flex-shrink: 0; color: var(--accent); }
        .toast.success .t-icon { color: var(--success); }
        .toast.error .t-icon { color: var(--danger); }

        /* Footer */
        .footer {
            text-align: center;
            font-size: var(--fs-xs);
            color: var(--text-muted);
            padding: var(--space-2) 0 0;
            position: relative;
            z-index: 10000;
            opacity: 0;
            animation: fadeInUp 0.7s var(--ease-out) 0.9s forwards;
        }
        .footer .author { color: var(--text-secondary); font-weight: 600; font-style: italic; }
        .footer .sep { margin: 0 var(--space-2); opacity: 0.4; }
        .footer a { color: var(--text-muted); text-decoration: none; transition: color var(--dur-normal) var(--ease); }
        .footer a:hover { color: var(--text-secondary); }

        /* 动画 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95) translateY(-8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 12px var(--accent-glow); }
            50% { opacity: 0.7; transform: scale(1.25); box-shadow: 0 0 20px var(--accent-glow); }
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes aura-pulse { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.08); } }
        @keyframes aura-drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(20px, -20px) rotate(5deg); }
            66% { transform: translate(-10px, 15px) rotate(-3deg); }
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut { to { opacity: 0; transform: translateY(-20px) scale(0.92); } }
        @keyframes dataFade {
            from { opacity: 0; transform: translateY(12px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes bar-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        @keyframes sunRotate { to { transform: rotate(360deg); } }
        @keyframes cloudDrift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
        @keyframes rainFall { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
        @keyframes snowFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(14px) rotate(180deg); opacity: 0; } }
        @keyframes lightning { 0%, 95%, 100% { opacity: 0; } 96%, 99% { opacity: 0.9; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            #weather-canvas { display: none; }
        }

        /* 响应式 */
        @media (max-width: 480px) {
            :root { --fs-display: clamp(3.5rem, 18vw, 4.5rem); }
            .app {
                padding: calc(var(--space-4) + var(--safe-top)) var(--space-3) var(--space-4);
                gap: var(--space-4);
            }
            .badge .update-text { display: none; }
            #last-update::after {
                content: attr(data-time);
                font-size: var(--fs-xs);
                color: var(--text-secondary);
            }
            #net-badge::after {
                content: attr(data-status);
                font-size: var(--fs-xs);
                color: var(--text-secondary);
            }
            .current-card {
                padding: var(--space-5);
                gap: var(--space-5);
            }
            .current-head {
                flex-direction: column;
                gap: var(--space-3);
            }
            .weather-icon-wrap {
                width: 72px;
                height: 72px;
                align-self: flex-end;
                margin-top: -60px;
            }
            .detail-grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }
            .detail-card { padding: var(--space-3); }
            .detail-card .dc-value { font-size: var(--fs-base); }
            .detail-card .dc-icon { width: 32px; height: 32px; margin-bottom: var(--space-2); }
            .detail-card .dc-icon svg { width: 16px; height: 16px; }
            .aqi-card { flex-direction: column; align-items: flex-start; gap: var(--space-3); }
            .panel { padding: var(--space-4); }
            .search {
                flex-wrap: nowrap;
                gap: var(--space-2);
            }
            .search-input {
                height: 48px;
                padding: 0 2.75rem 0 2.5rem;
                font-size: var(--fs-base);
                min-width: 0;
            }
            .search-icon { left: 0.9rem; }
            .search-shortcut { display: none; }
            .btn { height: 48px; padding: 0 var(--space-4); }
            .btn-ghost { width: 48px; height: 48px; padding: 0; flex-shrink: 0; }
            .forecast-item {
                grid-template-columns: 44px 28px 1fr auto;
                gap: var(--space-2);
                padding: var(--space-3);
            }
            .forecast-item .f-icon svg { width: 22px; height: 22px; }
            .forecast-item .f-day { font-size: var(--fs-xs); }
            .forecast-item .f-day small { font-size: 0.6rem; }
            .forecast-item .f-desc { font-size: var(--fs-xs); }
            .forecast-item .f-temps { font-size: var(--fs-xs); }
            .hour-card { min-width: 64px; padding: var(--space-3) var(--space-2); }
            .location-city { font-size: var(--fs-2xl); }
            /* 移动端减少 backdrop-filter 开销 */
            .glass { backdrop-filter: blur(16px) saturate(130%); -webkit-backdrop-filter: blur(16px) saturate(130%); }
            .search-input { backdrop-filter: blur(12px) saturate(130%); -webkit-backdrop-filter: blur(12px) saturate(130%); }
            /* 生活建议移动端 */
            .life-tips-grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }
            .life-tip-card { padding: var(--space-3); }
            .life-tip-card .lt-icon { width: 32px; height: 32px; font-size: 16px; }
            .sun-arc-svg { max-width: 220px; }
            .sun-arc-time { font-size: var(--fs-sm); }
        }

        @media (min-width: 768px) {
            .main-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: var(--space-5);
                align-items: start;
            }
            .detail-grid { grid-template-columns: repeat(3, 1fr); }
            .current-card { gap: var(--space-5); }
        }

        @media (min-width: 1024px) {
            .main-grid {
                display: grid;
                grid-template-columns: 1.1fr 0.9fr;
                gap: var(--space-6);
                align-items: start;
            }
            .detail-grid { grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .app { padding: var(--space-3) var(--space-4); }
            .current-card { padding: var(--space-4); gap: var(--space-4); }
            .temp-value { font-size: 3.5rem; }
        }

        .data-fade { animation: dataFade 0.5s var(--ease-out); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--glass-4); }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .btn:focus-visible,
        .search-input:focus-visible,
        .quick-city:focus-visible,
        .history-item:focus-visible,
        .hour-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
</head>
<body>

<canvas id="weather-canvas" aria-hidden="true"></canvas>

<div class="app">
    <header class="topbar">
        <div class="brand">
            <span class="brand-dot"></span>
            <span>SkyWeather · 云际天气</span>
        </div>
        <div class="topbar-meta">
            <div class="badge ipv6" id="net-badge" data-time="--:--" data-status="检测网络中" title="当前网络连接信息">
                <span class="dot"></span>
                <span class="update-text"><span id="net-text">检测网络中</span></span>
            </div>
            <div class="badge" id="last-update" data-time="--:--">
                <span class="dot"></span>
                <span class="update-text">更新于 <span id="update-time">--:--</span></span>
            </div>
            <button class="btn btn-ghost" id="btn-random-bg" aria-label="随机背景图" title="随机背景图">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
                </svg>
            </button>
        </div>
    </header>

    <section class="search" role="search">
        <div class="search-box">
            <span class="search-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
                </svg>
            </span>
            <input
                type="text"
                class="search-input"
                id="city"
                placeholder="搜索城市 / 地区（支持全球）"
                autocomplete="off"
                spellcheck="false"
                aria-label="搜索城市"
            >
            <kbd class="search-shortcut" aria-hidden="true">/</kbd>
            <div class="history" id="history" role="listbox"></div>
        </div>
        <button class="btn btn-primary" id="btn-search" aria-label="查询天气">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
            <span>查询</span>
        </button>
        <button class="btn btn-ghost" id="btn-refresh" aria-label="刷新" title="刷新">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
            </svg>
        </button>
    </section>

    <main class="main-grid" id="weather-display"></main>

    <footer class="footer">
        <p>© 2026 <a href="https://sylv.top/" target="_blank" rel="noopener noreferrer" style="font-weight:700">Sylvy</a>. All rights reserved.</p>
        <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">豫ICP备2026013756号-1</a></p>
    </footer>
</div>

<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script src="config.js"></script>
<script>
    // ===================== SVG 图标库 =====================
    let svgIdCounter = 0;
    function uniqueId(prefix) { return `${prefix}-${++svgIdCounter}`; }

    function getSunnyIcon() {
        const id = uniqueId('sun');
        return `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs><radialGradient id="${id}" cx="50%" cy="50%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="60%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ea580c"/></radialGradient></defs>
            <g style="transform-origin:32px 32px;animation:sunRotate 24s linear infinite">
                <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
                    <line x1="32" y1="4" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="60"/>
                    <line x1="4" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="60" y2="32"/>
                    <line x1="12" y1="12" x2="18" y2="18"/><line x1="46" y1="46" x2="52" y2="52"/>
                    <line x1="12" y1="52" x2="18" y2="46"/><line x1="46" y1="18" x2="52" y2="12"/>
                </g>
            </g>
            <circle cx="32" cy="32" r="14" fill="url(#${id})"/>
            <circle cx="32" cy="32" r="14" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
        </svg>`;
    }

    function getCloudyIcon() {
        const id = uniqueId('cloud');
        return `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient></defs>
            <g style="transform-origin:32px 32px;animation:cloudDrift 5s ease-in-out infinite">
                <ellipse cx="22" cy="34" rx="14" ry="10" fill="url(#${id})"/>
                <ellipse cx="36" cy="30" rx="16" ry="12" fill="url(#${id})"/>
                <ellipse cx="46" cy="38" rx="10" ry="8" fill="url(#${id})"/>
                <ellipse cx="28" cy="40" rx="12" ry="8" fill="url(#${id})"/>
            </g>
        </svg>`;
    }

    function getPartlyCloudyIcon() {
        const sunId = uniqueId('sun2');
        const cloudId = uniqueId('cloud2');
        return `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="${sunId}" cx="50%" cy="50%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></radialGradient>
                <linearGradient id="${cloudId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
            </defs>
            <g style="transform-origin:18px 18px;animation:sunRotate 24s linear infinite">
                <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="2" x2="18" y2="6"/><line x1="18" y1="30" x2="18" y2="34"/>
                    <line x1="2" y1="18" x2="6" y2="18"/><line x1="30" y1="18" x2="34" y2="18"/>
                    <line x1="7" y1="7" x2="10" y2="10"/><line x1="26" y1="26" x2="29" y2="29"/>
                    <line x1="7" y1="29" x2="10" y2="26"/><line x1="26" y1="10" x2="29" y2="7"/>
                </g>
            </g>
            <circle cx="18" cy="18" r="8" fill="url(#${sunId})"/>
            <g style="transform-origin:38px 38px;animation:cloudDrift 4s ease-in-out infinite">
                <ellipse cx="30" cy="40" rx="12" ry="9" fill="url(#${cloudId})"/>
                <ellipse cx="42" cy="36" rx="14" ry="10" fill="url(#${cloudId})"/>
                <ellipse cx="50" cy="44" rx="10" ry="8" fill="url(#${cloudId})"/>
            </g>
        </svg>`;
    }

    function getRainIcon() {
        const cloudId = uniqueId('rain-cloud');
        const dropId = uniqueId('rain-drop');
        return `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="${cloudId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
                <linearGradient id="${dropId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
            </defs>
            <g style="transform-origin:32px 24px;animation:cloudDrift 4s ease-in-out infinite">
                <ellipse cx="22" cy="26" rx="12" ry="9" fill="url(#${cloudId})"/>
                <ellipse cx="36" cy="22" rx="14" ry="10" fill="url(#${cloudId})"/>
                <ellipse cx="46" cy="30" rx="10" ry="8" fill="url(#${cloudId})"/>
            </g>
            <g stroke="url(#${dropId})" stroke-width="3" stroke-linecap="round" fill="none">
                <line x1="22" y1="42" x2="18" y2="56" style="animation:rainFall 1s ease-in infinite"/>
                <line x1="30" y1="44" x2="26" y2="58" style="animation:rainFall 1s ease-in 0.2s infinite"/>
                <line x1="38" y1="42" x2="34" y2="56" style="animation:rainFall 1s ease-in 0.4s infinite"/>
                <line x1="46" y1="44" x2="42" y2="58" style="animation:rainFall 1s ease-in 0.6s infinite"/>
            </g>
        </svg>`;
    }

    function getStormIcon() {
        const cloudId = uniqueId('storm-cloud');
        return `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="${cloudId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#1e293b"/></linearGradient></defs>
            <g style="transform-origin:32px 24px;animation:cloudDrift 4s ease-in-out infinite">
                <ellipse cx="22" cy="26" rx="12" ry="9" fill="url(#${cloudId})"/>
                <ellipse cx="36" cy="22" rx="14" ry="10" fill="url(#${cloudId})"/>
                <ellipse cx="46" cy="30" rx="10" ry="8" fill="url(#${cloudId})"/>
            </g>
            <path d="M30 36 L24 50 L32 50 L26 60 L40 44 L32 44 L36 36 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1" stroke-linejoin="round">
                <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
            </path>
        </svg>`;
    }

    function getSnowIcon() {
        const cloudId = uniqueId('snow-cloud');
        return `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="${cloudId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient></defs>
            <g style="transform-origin:32px 24px;animation:cloudDrift 4s ease-in-out infinite">
                <ellipse cx="22" cy="26" rx="12" ry="9" fill="url(#${cloudId})"/>
                <ellipse cx="36" cy="22" rx="14" ry="10" fill="url(#${cloudId})"/>
                <ellipse cx="46" cy="30" rx="10" ry="8" fill="url(#${cloudId})"/>

    function getWeatherType(text) {

    // WMO 天气代码转中文天气文本与内部类型
    function wmoToWeather(code) {
        const map = {
            0: ['晴', 'sunny'],
            1: ['大部晴朗', 'partlyCloudy'], 2: ['多云', 'partlyCloudy'], 3: ['阴', 'cloudy'],
            45: ['雾', 'fog'], 48: ['雾凇', 'fog'],
            51: ['毛毛雨', 'rain'], 53: ['小雨', 'rain'], 55: ['中雨', 'rain'],
            56: ['冻雨', 'rain'], 57: ['冻雨', 'rain'],
            61: ['小雨', 'rain'], 63: ['中雨', 'rain'], 65: ['大雨', 'rain'],
            66: ['冻雨', 'rain'], 67: ['冻雨', 'rain'],
            71: ['小雪', 'snow'], 73: ['中雪', 'snow'], 75: ['大雪', 'snow'],

            95: ['雷阵雨', 'storm'], 96: ['雷阵雨伴冰雹', 'storm'], 99: ['雷阵雨伴冰雹', 'storm'],
        };
        const [text, type] = map[code] || ['晴', 'sunny'];
        return { text, type };
    }

    function wmoText(code) { return wmoToWeather(code).text; }

    let lastCW = 0, lastCH = 0, lastDpr = 0;
    function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.visualViewport ? window.visualViewport.width : window.innerWidth;
        const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        // 仅在尺寸真正变化时才重置画布，避免地址栏频繁变化导致的清空闪烁
        if (Math.abs(w - lastCW) < 1 && Math.abs(h - lastCH) < 1 && dpr === lastDpr) return;
        canvas.width = Math.max(1, Math.floor(w * dpr));
        canvas.height = Math.max(1, Math.floor(h * dpr));
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        lastCW = w; lastCH = h; lastDpr = dpr;
    }
    let resizeTimer = null;
    function handleResize() {
        clearTimeout(resizeTimer);
        // 较长防抖以合并地址栏显示/隐藏引发的高频 resize

            // 现有粒子通过 vpH()/vpW() 在每帧自适应新边界，过渡更平滑。
        }, 200);
    }
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);
