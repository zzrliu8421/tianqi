    // ---- 工具函数 ----
    function lerp(a, b, t) { return a + (b - a) * t; }
    function rand(min, max) { return Math.random() * (max - min) + min; }
    function isMobile() { return window.innerWidth < 768; }
    function particleScale() { return isMobile() ? 0.55 : 1; }
    function vpH() { return window.visualViewport ? window.visualViewport.height : window.innerHeight; }
    function vpW() { return window.visualViewport ? window.visualViewport.width : window.innerWidth; }

    // ---- 水滴溅射特效 ----
    class Splash {
        constructor(x, y, intensity) {
            this.x = x;
            this.y = y;
            this.life = 1;
            this.decay = rand(0.03, 0.06);
            this.drops = [];
            const count = Math.floor(rand(2, 5 + intensity * 3));
            for (let i = 0; i < count; i++) {
                const angle = rand(-Math.PI, 0);
                const speed = rand(1, 3 + intensity * 2);
                this.drops.push({
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed * 1.2,
                    r: rand(0.5, 1.5 + intensity),
                    x: 0, y: 0
                });
            }
        }
        update() {
            this.life -= this.decay;
            for (const d of this.drops) {
                d.x += d.vx;
                d.y += d.vy;
                d.vy += 0.15; // 重力
            }
            return this.life > 0;
        }
        draw(c) {
            const alpha = Math.max(0, this.life * 0.6);
            c.fillStyle = `rgba(147, 197, 253, ${alpha})`;
            for (const d of this.drops) {
                c.beginPath();
                c.arc(this.x + d.x, this.y + d.y, d.r, 0, Math.PI * 2);
                c.fill();
            }
        }
    }

    // ---- 涟漪特效 ----
    class Ripple {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 0;
            this.maxRadius = rand(8, 20);
            this.life = 1;
            this.decay = rand(0.02, 0.04);
        }
        update() {
            this.life -= this.decay;
            this.radius = (1 - this.life) * this.maxRadius;
            return this.life > 0;
        }
        draw(c) {
            const alpha = Math.max(0, this.life * 0.35);
            c.strokeStyle = `rgba(147, 197, 253, ${alpha})`;
            c.lineWidth = 0.8;
            c.beginPath();
            c.ellipse(this.x, this.y, this.radius, this.radius * 0.4, 0, 0, Math.PI * 2);
            c.stroke();
        }
    }

    // ---- 雨滴：真实水滴形态 ----
    class RainDrop {
        constructor() { this.reset(true); }
        reset(initial = false) {
            const W = window.innerWidth;
            const H = vpH();
            const intensity = animIntensity;
            // 水滴大小随强度变化
            this.size = rand(1.5, 3 + intensity * 2);
            this.x = rand(-50, W + 50);
            this.y = initial ? rand(-H, H) : rand(-100, -20);
            // 速度随强度增加
            this.speed = rand(6, 10 + intensity * 8);
            this.opacity = rand(0.15, 0.4 + intensity * 0.2);
            // 风偏移
            this.windOffset = windSpeed * 0.3;
            this.slant = this.windOffset + rand(-0.15, 0.15);
            // 拖尾长度
            this.tailLen = this.speed * rand(1.2, 2.0);
            this.hasSplashed = false;
        }
        update() {
            this.y += this.speed;
            this.x += this.slant;
            const groundY = vpH() - 2;
            if (this.y >= groundY && !this.hasSplashed) {
                this.hasSplashed = true;
                // 生成溅射和涟漪
                if (Math.random() < 0.4 + animIntensity * 0.3) {
                    effects.push(new Splash(this.x, groundY, animIntensity));
                }
                if (Math.random() < 0.5) {
                    effects.push(new Ripple(this.x, groundY));
                }
            }
            if (this.y > vpH() + 30) this.reset();
        }
        draw(c) {
            // 水滴本体：上尖下圆的水滴形
            const alpha = this.opacity;
            const s = this.size;
            c.save();
            c.translate(this.x, this.y);
            // 根据风向旋转
            c.rotate(Math.atan2(this.slant, this.speed));

            // 绘制水滴形状
            c.fillStyle = `rgba(147, 197, 253, ${alpha})`;
            c.beginPath();
            c.moveTo(0, -this.tailLen);  // 尖端
            c.bezierCurveTo(s * 0.3, -this.tailLen * 0.5, s * 0.6, -s * 0.3, s * 0.5, 0);
            c.bezierCurveTo(s * 0.4, s * 0.5, 0, s * 0.7, 0, s * 0.7);
            c.bezierCurveTo(0, s * 0.7, -s * 0.4, s * 0.5, -s * 0.5, 0);
            c.bezierCurveTo(-s * 0.6, -s * 0.3, -s * 0.3, -this.tailLen * 0.5, 0, -this.tailLen);
            c.fill();

            // 高光
            c.fillStyle = `rgba(200, 225, 255, ${alpha * 0.4})`;
            c.beginPath();
            c.ellipse(s * 0.1, -this.tailLen * 0.3, s * 0.12, s * 0.25, 0, 0, Math.PI * 2);
            c.fill();

            c.restore();
        }
    }

    // ---- 雪花：六角形晶体 ----
    class SnowFlake {
        constructor() { this.reset(true); }
        reset(initial = false) {
            const W = window.innerWidth;
            const H = vpH();
            const intensity = animIntensity;
            this.x = rand(-20, W + 20);
            this.y = initial ? rand(-H * 0.2, H) : rand(-60, -10);
            this.r = rand(1.5, 4 + intensity * 2);
            this.speed = rand(0.3, 1.2 + this.r * 0.2);
            this.wind = windSpeed * 0.05;
            this.phase = rand(0, Math.PI * 2);
            this.phaseSpeed = rand(0.01, 0.03);
            this.opacity = rand(0.4, 0.85);
            this.rotation = rand(0, Math.PI * 2);
            this.rotationSpeed = (rand(-1, 1)) * 0.015;
            this.wobbleAmp = rand(0.3, 1.2);
            // 雪花分支数（6或8）
            this.branches = this.r > 3 ? 6 : 0; // 大雪花绘制晶体，小雪花只画圆
            this.innerRatio = rand(0.3, 0.5);
        }
        update() {
            this.y += this.speed;
            this.phase += this.phaseSpeed;
            this.rotation += this.rotationSpeed;
            this.x += this.wind + Math.sin(this.phase) * this.wobbleAmp;
            if (this.y > vpH() + 20) this.reset();
            if (this.x < -40 || this.x > window.innerWidth + 40) this.reset();
        }
        draw(c) {
            c.save();
            c.translate(this.x, this.y);
            c.rotate(this.rotation);
            c.globalAlpha = this.opacity;

            if (this.branches > 0) {
                // 绘制六角形雪花晶体
                c.strokeStyle = '#ffffff';
                c.lineWidth = Math.max(0.5, this.r * 0.15);
                c.lineCap = 'round';
                for (let i = 0; i < this.branches; i++) {
                    const angle = (Math.PI * 2 / this.branches) * i;
                    c.save();
                    c.rotate(angle);
                    // 主枝
                    c.beginPath();
                    c.moveTo(0, 0);
                    c.lineTo(this.r, 0);
                    c.stroke();
                    // 分枝
                    const bLen = this.r * this.innerRatio;
                    const bPos = this.r * 0.55;
                    c.beginPath();
                    c.moveTo(bPos, 0);
                    c.lineTo(bPos + bLen * 0.7, -bLen * 0.5);
                    c.stroke();
                    c.beginPath();
                    c.moveTo(bPos, 0);
                    c.lineTo(bPos + bLen * 0.7, bLen * 0.5);
                    c.stroke();
                    // 末端小分枝
                    const bPos2 = this.r * 0.8;
                    const bLen2 = bLen * 0.5;
                    c.beginPath();
                    c.moveTo(bPos2, 0);
                    c.lineTo(bPos2 + bLen2 * 0.6, -bLen2 * 0.5);
                    c.stroke();
                    c.beginPath();
                    c.moveTo(bPos2, 0);
                    c.lineTo(bPos2 + bLen2 * 0.6, bLen2 * 0.5);
                    c.stroke();
                    c.restore();
                }
                // 中心点
                c.fillStyle = '#ffffff';
                c.beginPath();
                c.arc(0, 0, this.r * 0.12, 0, Math.PI * 2);
                c.fill();
            } else {
                // 小雪花：柔和圆形带光晕
                const grad = c.createRadialGradient(0, 0, 0, 0, 0, this.r);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.5)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                c.fillStyle = grad;
                c.beginPath();
                c.arc(0, 0, this.r, 0, Math.PI * 2);
                c.fill();
            }

            c.globalAlpha = 1;
            c.restore();
        }
    }

    // ---- 晴天：阳光光束 + 光斑 ----
    class SunRay {
        constructor() { this.reset(true); }
        reset(initial = false) {
            const W = window.innerWidth;
            const H = vpH();
            // 光束从右上角射出
            this.originX = W * rand(0.7, 1.0);
            this.originY = rand(-20, H * 0.15);
            this.angle = rand(Math.PI * 0.55, Math.PI * 0.75);
            this.length = rand(H * 0.4, H * 0.9);
            this.width = rand(30, 80 + animIntensity * 40);
            this.opacity = rand(0.02, 0.06 + animIntensity * 0.03);
            this.speed = rand(0.0003, 0.001);
            this.phase = rand(0, Math.PI * 2);
            this.life = 1;
        }
        update() {
            this.phase += this.speed;
            this.opacity = (0.02 + Math.sin(this.phase) * 0.02) * (0.5 + animIntensity * 0.5);
        }
        draw(c) {
            c.save();
            c.translate(this.originX, this.originY);
            c.rotate(this.angle);
            const grad = c.createLinearGradient(0, 0, this.length, 0);
            grad.addColorStop(0, `rgba(251, 191, 36, ${this.opacity * 1.5})`);
            grad.addColorStop(0.3, `rgba(251, 191, 36, ${this.opacity})`);
            grad.addColorStop(1, 'rgba(251, 191, 36, 0)');
            c.fillStyle = grad;
            c.beginPath();
            c.moveTo(0, -this.width * 0.1);
            c.lineTo(this.length, -this.width * 0.5);
            c.lineTo(this.length, this.width * 0.5);
            c.lineTo(0, this.width * 0.1);
            c.closePath();
            c.fill();
            c.restore();
        }
    }

    class SunMote {
        constructor() { this.reset(true); }
        reset(initial = false) {
            const W = window.innerWidth;
            const H = vpH();
            this.x = rand(W * 0.3, W);
            this.y = initial ? rand(0, H) : rand(H + 20, H + 60);
            this.r = rand(1, 3 + animIntensity * 2);
            this.opacity = rand(0.1, 0.35);
            this.speed = rand(0.15, 0.5);
            this.phase = rand(0, Math.PI * 2);
            this.driftSpeed = rand(0.005, 0.015);
            this.driftAmp = rand(0.3, 1);
        }
        update() {
            this.y -= this.speed;
            this.phase += this.driftSpeed;
            this.x += Math.sin(this.phase) * this.driftAmp;
            this.opacity -= 0.0008;
            if (this.y < -20 || this.opacity <= 0) this.reset();
        }
        draw(c) {
            const grad = c.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 2);
            grad.addColorStop(0, `rgba(251, 191, 36, ${this.opacity})`);
            grad.addColorStop(0.5, `rgba(251, 191, 36, ${this.opacity * 0.4})`);
            grad.addColorStop(1, 'rgba(251, 191, 36, 0)');
            c.fillStyle = grad;
            c.beginPath();
            c.arc(this.x, this.y, this.r * 2, 0, Math.PI * 2);
            c.fill();
        }
    }

    // ---- 云朵：立体层次感 ----
    class CloudPuff {
        constructor() { this.reset(true); }
        reset(initial = false) {
            const W = window.innerWidth;
            const H = vpH();
            const intensity = animIntensity;
            this.x = initial ? rand(-200, W + 200) : -250;
            this.y = rand(H * 0.02, H * 0.35);
            this.w = rand(120, 220 + intensity * 60);
            this.h = this.w * rand(0.3, 0.45);
            this.speed = rand(0.08, 0.3 + intensity * 0.1);
            this.opacity = rand(0.04, 0.1 + intensity * 0.04);
            this.layer = rand(0, 1); // 0=远 1=近
            // 云朵由多个椭圆组成
            this.puffs = [];
            const count = Math.floor(rand(4, 7));
            for (let i = 0; i < count; i++) {
                this.puffs.push({
                    ox: rand(-0.35, 0.35) * this.w,
                    oy: rand(-0.2, 0.2) * this.h,
                    rw: rand(0.2, 0.4) * this.w,
                    rh: rand(0.25, 0.5) * this.h,
                });
            }
        }
        update() {
            this.x += this.speed;
            if (this.x > window.innerWidth + 300) this.reset();
        }
        draw(c) {
            const cx = this.x + this.w / 2;
            const cy = this.y + this.h / 2;
            // 阴影层
            c.fillStyle = `rgba(0, 0, 0, ${this.opacity * 0.3})`;
            for (const p of this.puffs) {
                c.beginPath();
                c.ellipse(cx + p.ox, cy + p.oy + 4, p.rw, p.rh, 0, 0, Math.PI * 2);
                c.fill();
            }
            // 主体
            c.fillStyle = `rgba(200, 215, 235, ${this.opacity})`;
            for (const p of this.puffs) {
                c.beginPath();
                c.ellipse(cx + p.ox, cy + p.oy, p.rw, p.rh, 0, 0, Math.PI * 2);
                c.fill();
            }
            // 高光
            c.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.6})`;
            for (const p of this.puffs) {
                c.beginPath();
                c.ellipse(cx + p.ox, cy + p.oy - p.rh * 0.2, p.rw * 0.7, p.rh * 0.5, 0, 0, Math.PI * 2);
                c.fill();
            }
        }
    }

    // ---- 雾/霾：层次流动 ----
    class FogVeil {
        constructor() { this.reset(true); }
        reset(initial = false) {
            const W = window.innerWidth;
            const H = vpH();
            const intensity = animIntensity;
            this.x = initial ? rand(-300, W + 300) : -400;
            this.y = rand(H * 0.2, H * 0.85);
            this.w = rand(200, 400 + intensity * 100);
            this.h = rand(40, 100 + intensity * 30);
            this.speed = rand(0.05, 0.2 + intensity * 0.05);
            this.opacity = rand(0.02, 0.06 + intensity * 0.03);
            this.phase = rand(0, Math.PI * 2);
            this.phaseSpeed = rand(0.003, 0.01);
            this.isHaze = currentAnim === 'haze';
        }
        update() {
            this.x += this.speed;
            this.phase += this.phaseSpeed;
            this.y += Math.sin(this.phase) * 0.3;
            if (this.x > window.innerWidth + 500) this.reset();
        }
        draw(c) {
            const baseColor = this.isHaze ? '180, 140, 100' : '203, 213, 225';
            const grad = c.createRadialGradient(
                this.x, this.y, 0,
                this.x, this.y, this.w
            );
            grad.addColorStop(0, `rgba(${baseColor}, ${this.opacity * 2.5})`);
            grad.addColorStop(0.4, `rgba(${baseColor}, ${this.opacity * 1.5})`);
            grad.addColorStop(0.7, `rgba(${baseColor}, ${this.opacity * 0.5})`);
            grad.addColorStop(1, `rgba(${baseColor}, 0)`);
            c.fillStyle = grad;
            c.beginPath();
            c.ellipse(this.x, this.y, this.w, this.h, 0, 0, Math.PI * 2);
            c.fill();
        }
    }

    // ---- 闪电 ----
    class Lightning {
        constructor() {
            const W = window.innerWidth;
            const H = vpH();
            this.startX = rand(W * 0.1, W * 0.9);
            this.startY = 0;
            this.segments = [];
            this.life = 1;
            this.decay = rand(0.04, 0.08);
            this.buildBolt(this.startX, this.startY, H * rand(0.4, 0.8), 3);
        }
        buildBolt(x, y, length, depth) {
            if (depth <= 0 || length < 20) return;
            let cx = x, cy = y;
            const steps = Math.floor(rand(4, 8));
            const stepLen = length / steps;
            for (let i = 0; i < steps; i++) {
                const nx = cx + rand(-30, 30) * (depth * 0.4);
                const ny = cy + stepLen;
                this.segments.push({ x1: cx, y1: cy, x2: nx, y2: ny, w: depth * 0.8 });
                // 分支
                if (depth > 1 && Math.random() < 0.35) {
                    this.buildBolt(nx, ny, length * rand(0.2, 0.4), depth - 1);
                }
                cx = nx;
                cy = ny;
            }
        }
        update() {
            this.life -= this.decay;
            return this.life > 0;
        }
        draw(c) {
            const alpha = Math.max(0, this.life);
            // 外发光
            c.shadowColor = `rgba(167, 139, 250, ${alpha * 0.8})`;
            c.shadowBlur = 20;
            c.strokeStyle = `rgba(200, 190, 255, ${alpha * 0.6})`;
            c.lineCap = 'round';
            c.lineJoin = 'round';
            for (const s of this.segments) {
                c.lineWidth = s.w * 2;
                c.beginPath();
                c.moveTo(s.x1, s.y1);
                c.lineTo(s.x2, s.y2);
                c.stroke();
            }
            // 内芯
            c.shadowBlur = 0;
            c.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
            for (const s of this.segments) {
                c.lineWidth = s.w * 0.6;
                c.beginPath();
                c.moveTo(s.x1, s.y1);
                c.lineTo(s.x2, s.y2);
                c.stroke();
            }
        }
    }

    // ---- 地面积水反射（雨天） ----
    function drawGroundReflection(c) {
        if (currentAnim !== 'rain' && currentAnim !== 'storm') return;
        const H = vpH();
        const W = window.innerWidth;
        const reflectH = 30 + animIntensity * 20;
        const grad = c.createLinearGradient(0, H - reflectH, 0, H);
        grad.addColorStop(0, 'rgba(96, 165, 250, 0)');
        grad.addColorStop(0.3, `rgba(96, 165, 250, ${0.02 + animIntensity * 0.03})`);
        grad.addColorStop(1, `rgba(96, 165, 250, ${0.04 + animIntensity * 0.04})`);
        c.fillStyle = grad;
        c.fillRect(0, H - reflectH, W, reflectH);
    }

    // ---- 积雪效果（雪天） ----
    function drawSnowGround(c) {
        if (currentAnim !== 'snow') return;
        const H = vpH();
        const W = window.innerWidth;
        const snowH = 10 + animIntensity * 15;
        const grad = c.createLinearGradient(0, H - snowH, 0, H);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        grad.addColorStop(0.4, `rgba(255, 255, 255, ${0.05 + animIntensity * 0.05})`);
        grad.addColorStop(1, `rgba(255, 255, 255, ${0.1 + animIntensity * 0.08})`);
        c.fillStyle = grad;
        c.fillRect(0, H - snowH, W, snowH);
    }

    // ---- 粒子工厂 ----
    function makeParticles(type) {
        const isMob = isMobile();
        const isLowPower = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (isLowPower) return [];
        const scale = particleScale();
        const intensity = animIntensity;
        switch (type) {
            case 'rain': {
                const count = Math.floor(lerp(30, 100, intensity) * scale);
                return Array.from({ length: count }, () => new RainDrop());
            }
            case 'storm': {
                lightningTimer && clearTimeout(lightningTimer);
                const count = Math.floor(lerp(50, 130, intensity) * scale);
                return Array.from({ length: count }, () => new RainDrop());
            }
            case 'snow': {
                const count = Math.floor(lerp(25, 70, intensity) * scale);
                return Array.from({ length: count }, () => new SnowFlake());
            }
            case 'sunny': {
                const rays = Math.floor(lerp(3, 6, intensity) * scale);
                const motes = Math.floor(lerp(15, 40, intensity) * scale);
                return [
                    ...Array.from({ length: rays }, () => new SunRay()),
                    ...Array.from({ length: motes }, () => new SunMote())
                ];
            }
            case 'partlyCloudy':
            case 'cloudy': {
                const count = Math.floor(lerp(4, 8, intensity) * scale);
                return Array.from({ length: count }, () => new CloudPuff());
            }
            case 'fog':
            case 'haze': {
                const count = Math.floor(lerp(6, 14, intensity) * scale);
                return Array.from({ length: count }, () => new FogVeil());
            }
            default: return [];
        }
    }

    // ---- 闪电调度（雷暴） ----
    let lightningTimer = null;
    function scheduleLightning() {
        if (lightningTimer) clearTimeout(lightningTimer);
        const flash = () => {
            // 画布闪电
            effects.push(new Lightning());
            // 屏幕闪光
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:3;pointer-events:none;opacity:0.4;animation:lightning 0.4s ease-out forwards';
            document.body.appendChild(overlay);
            setTimeout(() => overlay.remove(), 400);
            lightningTimer = setTimeout(flash, 3000 + Math.random() * 7000);
        };
        lightningTimer = setTimeout(flash, 1500 + Math.random() * 3000);
    }

    // ---- 动画主循环 ----
    function startAnimation(type, force = false) {
        if (animationId) cancelAnimationFrame(animationId);
        if (lightningTimer) { clearTimeout(lightningTimer); lightningTimer = null; }
        if (currentAnim === type && !force) return;
        currentAnim = type;
        particles = makeParticles(type);
        effects = [];
        if (!particles.length && type !== 'rain' && type !== 'storm' && type !== 'snow') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            animationId = null;
            return;
        }
        if (type === 'storm') scheduleLightning();
        lastFrameTime = performance.now();

        function tick(now) {
            // 帧率控制
            const delta = now - lastFrameTime;
            if (delta < FRAME_INTERVAL * 0.8) {
                animationId = requestAnimationFrame(tick);
                return;
            }
            lastFrameTime = now;

            const W = window.innerWidth;
            const H = vpH();
            ctx.clearRect(0, 0, W, H);

            // 更新和绘制粒子
            for (const p of particles) {
                p.update();
                p.draw(ctx);
            }

            // 更新和绘制特效
            effects = effects.filter(e => {
                const alive = e.update();
                if (alive) e.draw(ctx);
                return alive;
            });

            // 地面效果
            drawGroundReflection(ctx);
            drawSnowGround(ctx);

            animationId = requestAnimationFrame(tick);
        }
        animationId = requestAnimationFrame(tick);
    }

    function setTheme(type) {
        document.body.classList.remove('theme-sunny', 'theme-cloudy', 'theme-rain', 'theme-storm', 'theme-snow', 'theme-fog', 'theme-haze');
        document.body.classList.add(`theme-${type}`);
    }

    // ===================== 随机背景图 =====================
    const BG_API_URL = 'https://pic.api.sylv.top/image';
    const BG_STORAGE_KEY = 'skyweather_random_bg_enabled';
    const BG_IMAGE_URL_KEY = 'skyweather_random_bg_url';

    function getBgEnabled() {
        try { return localStorage.getItem(BG_STORAGE_KEY) === 'true'; }
        catch (e) { return false; }
    }

    function setBgEnabled(enabled) {
        try { localStorage.setItem(BG_STORAGE_KEY, enabled ? 'true' : 'false'); }
        catch (e) {}
    }

    function getCachedBgUrl() {
        try { return localStorage.getItem(BG_IMAGE_URL_KEY) || ''; }
        catch (e) { return ''; }
    }

    function setCachedBgUrl(url) {
        try { localStorage.setItem(BG_IMAGE_URL_KEY, url || ''); }
        catch (e) {}
    }

    function clearBackgroundImage() {
        document.body.classList.remove('has-bg-image');
        document.body.style.removeProperty('--bg-image');
    }

    function applyBackgroundImage(url) {
        if (!url) return;
        document.body.style.setProperty('--bg-image', `url(${url})`);
        document.body.classList.add('has-bg-image');
    }

    function loadRandomBackground() {
        if (!getBgEnabled()) return;

        const cached = getCachedBgUrl();
        if (cached) {
            applyBackgroundImage(cached);
            return;
        }

        // 无缓存时才请求新图，加载后缓存，后续始终复用
        const imageUrl = `${BG_API_URL}?t=${Date.now()}`;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
            setCachedBgUrl(imageUrl);
            applyBackgroundImage(imageUrl);
        };
        img.onerror = () => {
            // 加载失败时保持渐变背景
        };
        img.src = imageUrl;
    }

    function updateRandomBgToggle() {
        const enabled = getBgEnabled();
        btnRandomBg.classList.toggle('active', enabled);
        if (enabled) loadRandomBackground();
        else clearBackgroundImage();
    }

    // ===================== 工具函数 =====================
    function escapeHTML(s) {
        return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function getComfort(t) {
        t = parseFloat(t);
        if (isNaN(t)) return { text: '--', cls: '' };
        if (t < 0) return { text: '极冷', cls: 'cold' };
        if (t < 10) return { text: '寒冷', cls: 'cold' };
        if (t < 18) return { text: '凉爽', cls: '' };
        if (t < 25) return { text: '舒适', cls: '' };
        if (t < 30) return { text: '温暖', cls: 'warm' };
        if (t < 35) return { text: '炎热', cls: 'warm' };
        return { text: '酷热', cls: 'hot' };
    }

    function getWindLevel(speedKmh) {
        const s = parseFloat(speedKmh) || 0;
        if (s < 1) return '无风';
        if (s < 12) return '微风';
        if (s < 20) return '和风';
        if (s < 29) return '强风';
        if (s < 39) return '疾风';
        return '大风';
    }

    function getHumidityLevel(h) {
        h = parseInt(h) || 0;
        if (h < 30) return '干燥';
        if (h < 60) return '舒适';
        if (h < 80) return '潮湿';
        return '闷热';
    }

    function getUVLevel(uv) {
        const u = parseFloat(uv) || 0;
        if (u < 3) return { text: '低', cls: 'success' };
        if (u < 6) return { text: '中等', cls: 'warning' };
        if (u < 8) return { text: '高', cls: 'danger' };
        if (u < 11) return { text: '极高', cls: 'danger' };
        return { text: '危险', cls: 'danger' };
    }

    function getAQIInfo(aqi) {
        const v = parseInt(aqi) || 0;
        if (v <= 50) return { level: '优', cls: 'aqi-good', desc: '空气质量令人满意，基本无空气污染。' };
        if (v <= 100) return { level: '良', cls: 'aqi-moderate', desc: '空气质量可接受，但某些污染物可能对极少数异常敏感人群健康有较弱影响。' };
        if (v <= 150) return { level: '轻度污染', cls: 'aqi-unhealthy-sensitive', desc: '易感人群症状有轻度加剧，健康人群出现刺激症状。' };
        if (v <= 200) return { level: '中度污染', cls: 'aqi-unhealthy', desc: '进一步加剧易感人群症状，可能对健康人群心脏、呼吸系统有影响。' };
        if (v <= 300) return { level: '重度污染', cls: 'aqi-very-unhealthy', desc: '心脏病和肺病患者症状显著加剧，运动耐受力降低，健康人群普遍出现症状。' };
        return { level: '严重污染', cls: 'aqi-hazardous', desc: '健康人群运动耐受力降低，有明显强烈症状，提前出现某些疾病。' };
    }

    function getWeekday(date) {
        const d = date ? new Date(date) : new Date();
        const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        return days[d.getDay()];
    }

    function formatTime(date) {
        const d = new Date(date);
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function formatDate(d) {
        const date = new Date(d);
        return `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    // 风向角度转 16 方位中文
    function degToDirection(deg) {
        const dirs = ['北', '北东北', '东北', '东东北', '东', '东东南', '东南', '南东南', '南', '南西南', '西南', '西西南', '西', '西西北', '西北', '北西北'];
        return dirs[Math.round(parseFloat(deg) / 22.5) % 16] || '--';
    }

    // 中国风力等级转 km/h（粗略）
    function windScaleToKmh(scale) {
        const s = parseInt(scale) || 0;
        if (s <= 0) return 0;
        if (s <= 1) return 2;
        if (s <= 2) return 6;
        if (s <= 3) return 12;
        if (s <= 4) return 20;
        if (s <= 5) return 29;
        if (s <= 6) return 40;
        if (s <= 7) return 51;
        if (s <= 8) return 63;
        return 75;
    }

    function countryBadge(loc) {
        const cc = loc.countryCode || (loc.country ? String(loc.country).slice(0, 2).toUpperCase() : '');
        return cc || 'UN';
    }

    // ===================== 历史记录 =====================
    function getHistory() {
        try { return JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY)) || []; }
        catch { return []; }
    }
    function saveHistory(city) {
        let h = getHistory().filter(x => x !== city);
        h.unshift(city);
        if (h.length > CONFIG.MAX_HISTORY) h = h.slice(0, CONFIG.MAX_HISTORY);
        localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(h));
    }
    function removeHistory(city) {
        const h = getHistory().filter(x => x !== city);
        localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(h));
        renderHistory();
    }
    function clearHistory() {
        localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify([]));
        renderHistory();
        showToast('已清空历史', 'success');
    }
    function renderHistory() {
        const h = getHistory();
        if (!h.length) { historyBox.classList.remove('show'); return; }
        historyBox.innerHTML = `
            <div class="history-header"><span>最近搜索</span><button class="history-clear" id="history-clear">清空</button></div>
            ${h.map(c => `
                <div class="history-item" data-city="${escapeHTML(c)}" role="option" tabindex="0">
                    <span class="h-label">${ICONS.mapPin}<span>${escapeHTML(c)}</span></span>
                    <button class="h-remove" data-city="${escapeHTML(c)}" aria-label="删除">${ICONS.trash}</button>
                </div>
            `).join('')}
        `;
        if (document.activeElement === cityInput) historyBox.classList.add('show');

    // ===================== Toast =====================
    function showToast(msg, type = '') {
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        const iconMap = { success: ICONS.check, error: ICONS.alert };
        t.innerHTML = `<span class="t-icon">${iconMap[type] || ''}</span><span>${escapeHTML(msg)}</span>`;
        toastStack.appendChild(t);
        setTimeout(() => {
            t.classList.add('removing');
            setTimeout(() => t.remove(), 300);
        }, 2800);
    }

    // ===================== 网络检测 =====================
    function isPublicIP(ip) {
        if (!ip || typeof ip !== 'string') return false;
        // 排除本地回环、私有 IPv4、链路本地 IPv6 等
        if (ip === '127.0.0.1' || ip === '::1') return false;
        if (ip.startsWith('10.') || ip.startsWith('192.168.')) return false;
        if (ip.startsWith('172.')) {
            const second = parseInt(ip.split('.')[1], 10);
            if (second >= 16 && second <= 31) return false;
        }
        if (ip.startsWith('fe80') || ip.startsWith('fc00') || ip.startsWith('fd00')) return false;
        return true;
    }

    async function detectNetwork() {
        const setStatus = (status, ipv6 = false) => {
            netBadge.classList.toggle('ipv6', ipv6);
            netBadge.setAttribute('data-status', status);
            netText.textContent = status;
        };

        // 复用 fetchPublicIP（与 locateIP 共享缓存，避免重复探测）
        const { isIPv6, ok } = await fetchPublicIP();
        if (ok) {
            setStatus(isIPv6 ? 'IPv6 已连接' : 'IPv4 网络', isIPv6);
            return isIPv6;
        }

        // Fallback：RTCPeerConnection 本地候选检测（最后一道防线，仅依赖公网候选）
        try {
            const pc = new RTCPeerConnection({ iceServers: [] });
            pc.createDataChannel('');
            const candidates = new Set();
            pc.onicecandidate = (e) => {
                if (!e.candidate) return;
                const ip = /([0-9a-fA-F:.]{7,})/.exec(e.candidate.candidate)?.[1];
                if (ip) candidates.add(ip);
            };
            await new Promise((resolve) => {
                pc.createOffer().then(o => pc.setLocalDescription(o));
                setTimeout(resolve, 1200);
            });
            pc.close();
            // 仅使用公网候选，避免 fe80:: 等链路本地地址被误判为 IPv6
            const publicCandidates = Array.from(candidates).filter(isPublicIP);
            const hasV4 = publicCandidates.some(ip => !ip.includes(':'));
            const hasV6 = publicCandidates.some(ip => ip.includes(':'));
            const isV6 = hasV6 && !hasV4;
            setStatus(isV6 ? 'IPv6 已连接' : (hasV4 || hasV6 ? 'IPv4 网络' : '网络检测失败'), isV6);
            return isV6;
        } catch {
            setStatus('网络检测失败');
            return false;
        }
    }

    // ===================== API 提供者 =====================
    async function fetchJSON(url, options = {}) {
        const timeout = options.timeout || 8000;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        try {
            const res = await fetch(url, { ...options, signal: controller.signal });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } finally {
            clearTimeout(timer);
        }
    }

    // ===================== Open-Meteo 数据解析（供多源复用）=====================
    async function fetchOpenMeteoForecast(lat, lon) {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
            `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,pressure_msl,surface_pressure,wind_speed_10m,wind_direction_10m,visibility,is_day,precipitation` +
            `&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m` +
            `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max` +
            `&timezone=auto&forecast_days=7`;
        return fetchJSON(url);
    }

    async function fetchOpenMeteoAQI(lat, lon) {
        const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm10,pm2_5,nitrogen_dioxide,ozone`;
        return fetchJSON(url).catch(() => null);
    }

    function parseOpenMeteoWeather(data, loc, source = 'Open-Meteo') {
        if (!data.current) throw new Error('Open-Meteo 数据异常');
        const cur = data.current;
        const weather = wmoText(cur.weather_code);
        const now = new Date();
        let currentPop = null;
        const hourly = [];
        for (let i = 0; i < (data.hourly?.time?.length || 0); i++) {
            const t = new Date(data.hourly.time[i]);
            if (t < now) continue;
            if (hourly.length >= 24) break;
            const pop = data.hourly.precipitation_probability[i];
            if (currentPop === null && Math.abs(t.getTime() - now.getTime()) < 3600000) currentPop = pop;
            hourly.push({
                time: data.hourly.time[i],
                label: formatTime(data.hourly.time[i]),
                temp: data.hourly.temperature_2m[i],
                weather: wmoText(data.hourly.weather_code[i]),
                weatherCode: data.hourly.weather_code[i],
                precipProbability: pop,
                windSpeed: data.hourly.wind_speed_10m[i],
            });
        }
        const daily = [];
        for (let i = 0; i < (data.daily?.time?.length || 0); i++) {
            daily.push({
                date: data.daily.time[i],
                minTemp: data.daily.temperature_2m_min[i],
                maxTemp: data.daily.temperature_2m_max[i],
                weather: wmoText(data.daily.weather_code[i]),
                weatherCode: data.daily.weather_code[i],
                precipProbability: data.daily.precipitation_probability_max[i],
                sunrise: data.daily.sunrise?.[i] ? formatTime(data.daily.sunrise[i]) : null,
                sunset: data.daily.sunset?.[i] ? formatTime(data.daily.sunset[i]) : null,
            });
        }
        return {
            location: {
                city: loc.city,
                province: loc.province,
                country: loc.country,
                countryCode: loc.countryCode,
                lat: loc.lat,
                lon: loc.lon,
                timezone: data.timezone || loc.timezone || 'UTC',
            },
            current: {
                temp: cur.temperature_2m,
                feelsLike: cur.apparent_temperature,
                weather,
                weatherCode: cur.weather_code,
                humidity: cur.relative_humidity_2m,
                pressure: cur.pressure_msl,
                windSpeed: cur.wind_speed_10m,
                windDirection: degToDirection(cur.wind_direction_10m),
                windDirectionDeg: cur.wind_direction_10m,
                visibility: cur.visibility ? (cur.visibility / 1000).toFixed(1) : null,
                uv: data.daily?.uv_index_max?.[0] ?? null,
                precipProbability: currentPop,
                aqi: null,
            },
            hourly,
            daily,
            source,
            updatedAt: cur.time || new Date().toISOString(),
        };
    }

    function mergeAQI(target, aqiData) {
        const current = aqiData?.current;
        if (!current) return target;
        target.current.aqi = current.us_aqi != null ? parseInt(current.us_aqi) : target.current.aqi;
        target.current.aqiPm25 = current.pm2_5 != null ? parseFloat(current.pm2_5).toFixed(1) : target.current.aqiPm25;
        target.current.aqiPm10 = current.pm10 != null ? parseFloat(current.pm10).toFixed(1) : target.current.aqiPm10;
        target.current.aqiNo2 = current.nitrogen_dioxide != null ? parseFloat(current.nitrogen_dioxide).toFixed(1) : target.current.aqiNo2;
        target.current.aqiO3 = current.ozone != null ? parseFloat(current.ozone).toFixed(1) : target.current.aqiO3;
        return target;
    }

    // 地理编码结果与查询词的相关性校验，避免不存在的城市被解析为默认地点
    function validateGeocodeMatch(query, loc, providerKey) {
        if (!loc || !loc.city) return false;
        const q = String(query).toLowerCase().trim();
        const city = String(loc.city).toLowerCase();
        const province = String(loc.province || '').toLowerCase();
        const country = String(loc.country || '').toLowerCase();
        const formatted = String(loc.formatted || '').toLowerCase();
        const tokens = q.split(/\s+/).filter(Boolean);

        if (providerKey === 'amap' || providerKey === 'qweather') {
            // 中文查询要求返回地名中至少包含一个查询词素
            if (/[\u4e00-\u9fa5]/.test(q)) {
                return tokens.some(t => city.includes(t) || province.includes(t) || formatted.includes(t));
            }
            // 英文查询做宽松匹配
            return tokens.some(t => t.length >= 2 && (city.includes(t) || province.includes(t) || formatted.includes(t)));
        }
        if (providerKey === 'openmeteo') {
            return tokens.some(t => t.length >= 2 && (city.includes(t) || province.includes(t) || country.includes(t)))
                || city.includes(q) || q.includes(city);
        }
        return true;
    }

    // ===================== 天气服务：多源降级 =====================
    // 缓存公网 IP 与网络类型，避免 detectNetwork 和 locateIP 重复探测
    let _cachedPublicIP = null;
    let _cachedIsIPv6 = null;
    let _ipFetchDone = false;

    async function fetchPublicIP() {
        if (_ipFetchDone) {
            return { ip: _cachedPublicIP, isIPv6: _cachedIsIPv6, ok: _cachedPublicIP !== null };
        }
        // 优先国内可访问的服务（ipify 在国内被墙）
        try {
            const [cfRes, ipipRes] = await Promise.allSettled([
                fetch('https://www.cloudflare.com/cdn-cgi/trace').then(r => r.text()),
                fetch('https://myip.ipip.net', { headers: { 'Accept': 'text/plain' } }).then(r => r.text())
            ]);
            const ips = [];
            if (cfRes.status === 'fulfilled') {
                const m = /ip=(\S+)/.exec(cfRes.value);
                if (m && isPublicIP(m[1])) ips.push(m[1]);
            }
            if (ipipRes.status === 'fulfilled') {
                const m = /(\d+\.\d+\.\d+\.\d+|[0-9a-fA-F:]{2,})/.exec(ipipRes.value || '');
                if (m && isPublicIP(m[1])) ips.push(m[1]);
            }
            if (ips.length) {
                const hasV6 = ips.some(ip => ip.includes(':'));
                const hasV4 = ips.some(ip => !ip.includes(':'));
                _cachedPublicIP = hasV4 ? ips.find(ip => !ip.includes(':')) : ips[0];
                _cachedIsIPv6 = hasV6 && !hasV4;
                _ipFetchDone = true;
                return { ip: _cachedPublicIP, isIPv6: _cachedIsIPv6, ok: true };
            }
        } catch (e) { console.warn('[IP] 主检测失败:', e.message); }

        // 备用：ipify（海外可用）
        try {
            const [v4Res, v6Res] = await Promise.allSettled([
                fetchJSON('https://api4.ipify.org?format=json'),
                fetchJSON('https://api6.ipify.org?format=json')
            ]);
            const v4IP = v4Res.status === 'fulfilled' && v4Res.value?.ip && isPublicIP(v4Res.value.ip) ? v4Res.value.ip : null;
            const v6IP = v6Res.status === 'fulfilled' && v6Res.value?.ip && isPublicIP(v6Res.value.ip) ? v6Res.value.ip : null;
            if (v4IP || v6IP) {
                _cachedPublicIP = v4IP || v6IP;
                _cachedIsIPv6 = !v4IP && !!v6IP;
                _ipFetchDone = true;
                return { ip: _cachedPublicIP, isIPv6: _cachedIsIPv6, ok: true };
            }
        } catch (e) { console.warn('[IP] ipify 检测失败:', e.message); }

        // 全部失败：不缓存，允许 detectNetwork 走 RTCPeerConnection 兜底
        return { ip: null, isIPv6: false, ok: false };
    }

    const WeatherService = {
        async locateIP() {
            // 分流策略：
            // 1. 先检测网络类型（IPv4/IPv6）并获取公网 IP（国内优先，ipify 在国内被墙）
            // 2. IPv6 网络 → 用 IPnews 定位（GeoDB 不支持 IPv6，高德 IPv6 需付费）
            // 3. IPv4 网络 → 用 GeoDB 判断地域：
            //    - 中国大陆 IP → 高德定位（更精确，返回 adcode）
            //    - 海外 IP → 直接使用 GeoDB 结果
            // 4. 以上均失败 → 按 IP_PROVIDER_ORDER 降级
            const geoDB = Providers.geodb;
            const amapIP = Providers.amap_ip;
            const ipnews = Providers.ipnews;

            // 第一步：检测网络类型并获取公网 IP（复用缓存，避免重复探测）
            const { ip: publicIP, isIPv6 } = await fetchPublicIP();

            // 第二步：IPv6 网络 → IPnews 定位
            if (isIPv6 && publicIP && ipnews && ipnews.available()) {
                try {
                    const ipnewsResult = await ipnews.locateIP(publicIP);
                    if (ipnewsResult && ipnewsResult.lat != null && ipnewsResult.lon != null
                        && isFinite(ipnewsResult.lat) && isFinite(ipnewsResult.lon)) {
                        ipnewsResult._provider = ipnews.name;
                        ipnewsResult._ipv6 = true;
                        console.info('[IP] IPv6 网络，使用 IPnews 定位');
                        return ipnewsResult;
                    }
                    console.warn('[IP] IPnews 定位返回无效坐标，回退到其他源');
                } catch (e) { console.warn('[IP] IPnews 定位失败:', e.message); }
            }

            // 第三步：IPv4 网络 → GeoDB 判断地域分流
            let geoDBResult = null;
            if (geoDB && geoDB.available()) {
                try {
                    geoDBResult = await geoDB.locateIP();
                } catch (e) { console.warn('[IP] GeoDB 初步查询失败:', e.message); }
            }

            if (geoDBResult) {
                const isChina = geoDBResult.countryCode === 'CN';
                if (isChina && amapIP && amapIP.available()) {
                    // 中国大陆 IP：用高德重新定位，获取更精确的 adcode 和坐标
                    // 传入 publicIP：避免边缘函数代理时高德误把边缘节点 IP 当作用户 IP
                    try {
                        const amapResult = await amapIP.locateIP(publicIP);
                        if (amapResult && amapResult.lat != null && amapResult.lon != null
                            && isFinite(amapResult.lat) && isFinite(amapResult.lon)) {
                            amapResult._provider = amapIP.name;
                            amapResult._ipv6 = amapIP.ipv6;
                            console.info('[IP] 中国大陆 IP，使用高德定位');
                            return amapResult;
                        }
                        console.warn('[IP] 高德定位返回无效坐标，回退到 GeoDB');
                    } catch (e) { console.warn('[IP] 高德定位失败，回退到 GeoDB:', e.message); }
                }
                // 海外 IP 或高德不可用：直接使用 GeoDB 结果
                if (geoDBResult.lat != null && geoDBResult.lon != null
                    && isFinite(geoDBResult.lat) && isFinite(geoDBResult.lon)) {
                    geoDBResult._provider = geoDB.name;
                    geoDBResult._ipv6 = geoDB.ipv6;
                    console.info(`[IP] ${isChina ? '高德不可用，回退到' : '海外 IP，使用'} GeoDB`);
                    return geoDBResult;
                }
            }

            // 第四步：GeoDB 完全失败时，按配置顺序降级尝试所有提供者
            for (const key of CONFIG.IP_PROVIDER_ORDER) {
                const providerKey = key === 'amap' ? 'amap_ip' : key;
                const p = Providers[providerKey];
                if (!p || !p.available()) continue;
                // 跳过已经尝试过的 GeoDB
                if (p === geoDB) continue;
                try {
                    // amap_ip 同样需要 publicIP 才能避免边缘节点误判
                    const loc = p === amapIP
                        ? await p.locateIP(publicIP)
                        : await p.locateIP();
                    if (loc && loc.lat != null && loc.lon != null && isFinite(loc.lat) && isFinite(loc.lon)) {
                        loc._provider = p.name;
                        loc._ipv6 = p.ipv6;
                        return loc;
                    }
                    console.warn(`[IP] ${p.name} 返回结果缺少有效坐标，跳过`);
                } catch (e) { console.warn(`[IP] ${p.name} 失败:`, e.message); }
            }
            throw new Error('IP 定位失败，请手动输入城市');
        },

        async geocode(city) {
            // 常见海外城市中文名映射，避免被高德误解析为国内同名地点
            const overseasZh = {
                '纽约': 'New York', '伦敦': 'London', '东京': 'Tokyo', '巴黎': 'Paris',
                '悉尼': 'Sydney', '新加坡': 'Singapore', '洛杉矶': 'Los Angeles',
                '旧金山': 'San Francisco', '西雅图': 'Seattle', '芝加哥': 'Chicago',
                '柏林': 'Berlin', '罗马': 'Rome', '马德里': 'Madrid', '莫斯科': 'Moscow',
                '首尔': 'Seoul', '曼谷': 'Bangkok', '吉隆坡': 'Kuala Lumpur',
                '多伦多': 'Toronto', '温哥华': 'Vancouver', '迪拜': 'Dubai',
            };
            const query = overseasZh[city] || city;
            const isChinese = /[\u4e00-\u9fa5]/.test(query);
            // 中文优先用高德（中国适用性），非中文/海外中文名优先用全球源
            const order = isChinese
                ? CONFIG.PROVIDER_ORDER
                : ['openmeteo', 'qweather', 'amap'];
            for (const key of order) {
                const p = Providers[key];
                if (!p || !p.available() || !p.geocode) continue;
                try {
                    const loc = await p.geocode(query);
                    if (loc && validateGeocodeMatch(query, loc, key)) {
                        loc._provider = p.name;
                        // 使用原始中文名作为显示城市
                        if (overseasZh[city]) loc.city = city;
                        return loc;
                    }
                } catch (e) { console.warn(`[Geocode] ${p.name} 失败:`, e.message); }
            }
            throw new Error('找不到该城市，请检查城市名称');
        },

        async getWeather(location) {
            // 根据地区智能选择天气源顺序
            const isChina = !location.countryCode || location.countryCode === 'CN';
            // 中国地址：高德(实况+adcode) > Open-Meteo(全球+AQI) > 和风(需Key)
            // 海外地址：Open-Meteo > 和风 > 高德(不支持海外)
            const order = isChina
                ? ['amap', 'openmeteo', 'qweather']
                : ['openmeteo', 'qweather', 'amap'];
            for (const key of order) {
                const p = Providers[key];
                if (!p || !p.available() || !p.getWeather) continue;
                // 海外地址跳过仅支持中国的源
                if (location.countryCode && location.countryCode !== 'CN' && !p.overseas) {
                    console.warn(`[Weather] 跳过 ${p.name}，不支持海外`);
                    continue;
                }
                try {
                    const data = await p.getWeather(location);
                    if (data) {
                        data._provider = p.name;
                        data._ipv6 = p.ipv6;
                        return data;
                    }
                } catch (e) { console.warn(`[Weather] ${p.name} 失败:`, e.message); }
            }
            throw new Error('所有数据源均无法获取天气，请稍后重试');
        }
    };

    function renderSunArc(daily0) {
        if (!daily0?.sunrise && !daily0?.sunset) return '';
        const sunrise = daily0.sunrise || '06:00';
        const sunset = daily0.sunset || '18:00';
        // 计算日照进度
        const now = new Date();
        const [sh, sm] = sunrise.split(':').map(Number);
        const [eh, em] = sunset.split(':').map(Number);
        const sunriseMin = sh * 60 + sm;
        const sunsetMin = eh * 60 + em;
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const dayLen = sunsetMin - sunriseMin || 1;
        let progress = 0;
        let isDay = false;
        if (nowMin >= sunriseMin && nowMin <= sunsetMin) {
            progress = (nowMin - sunriseMin) / dayLen;
            isDay = true;
        } else if (nowMin > sunsetMin) {
            progress = 1;
        }
        // 弧线上太阳位置
        const sunAngle = Math.PI * (1 - progress); // 从左到右
        const arcR = 42;
        const cx = 50, cy = 52;
        const sunX = cx + arcR * Math.cos(sunAngle);
        const sunY = cy - arcR * Math.sin(sunAngle);
        // 日照时长
        const dayHours = Math.floor(dayLen / 60);
        const dayMins = dayLen % 60;
        const dayLenStr = dayHours > 0 ? `${dayHours}h ${dayMins}m` : `${dayMins}m`;

        return `
            <div class="glass panel reveal d2 sun-arc-panel">
                <div class="section-head">
                    <div class="section-title">${ICONS.sunrise}<span>日出日落</span></div>
                    <span class="section-action">${dayLenStr} 日照</span>
                </div>
                <div class="sun-arc-wrap">
                    <svg viewBox="0 0 100 58" class="sun-arc-svg" aria-hidden="true">
                        <!-- 地平线 -->
                        <line x1="5" y1="52" x2="95" y2="52" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
                        <!-- 弧线轨道 -->
                        <path d="M 8 52 A 42 42 0 0 1 92 52" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linecap="round"/>
                        <!-- 已过弧线 -->
                        ${isDay ? `<path d="M 8 52 A 42 42 0 0 1 92 52" fill="none" stroke="url(#sunGrad)" stroke-width="2" stroke-linecap="round"
                            stroke-dasharray="${progress * 131.95} 131.95"/>` : ''}
                        <defs>
                            <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="0">
                                <stop offset="0%" stop-color="#fbbf24"/>
                                <stop offset="100%" stop-color="#f97316"/>
                            </linearGradient>
                        </defs>
                        <!-- 太阳 -->
                        ${isDay ? `
                        <circle cx="${sunX}" cy="${sunY}" r="3.5" fill="#fbbf24">
                            <animate attributeName="r" values="3.5;4;3.5" dur="3s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="${sunX}" cy="${sunY}" r="6" fill="rgba(251,191,36,0.2)">
                            <animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite"/>
                        </circle>
                        ` : ''}
                    </svg>
                    <div class="sun-arc-labels">
                        <div class="sun-arc-item">
                            <span class="sun-arc-icon">${ICONS.sunrise}</span>
                            <div>
                                <div class="sun-arc-time">${sunrise}</div>
                                <div class="sun-arc-text">日出</div>
                            </div>
                        </div>
                        <div class="sun-arc-item">
                            <span class="sun-arc-icon">${ICONS.sunset}</span>
                            <div>
                                <div class="sun-arc-time">${sunset}</div>
                                <div class="sun-arc-text">日落</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

        // 紫外线建议

            else if (current.uv < 11) uvAdvice = '紫外线很强，尽量避免户外活动';
            else uvAdvice = '紫外线极强，请避免外出';

            tips.push({
                icon: '☀️',
                title: '紫外线',
                value: `${current.uv} (${uvInfo.text})`,
                desc: uvAdvice
            });
        }

        // 运动建议
        let sportAdvice = '';
        const isRain = current.weather?.includes('雨') || current.weather?.includes('雷');
        const isSnow = current.weather?.includes('雪');
        if (isRain || isSnow) sportAdvice = '天气不佳，建议室内运动';
        else if (current.temp > 35) sportAdvice = '天气炎热，避免剧烈运动';
        else if (current.temp < 5) sportAdvice = '天气寒冷，注意保暖运动';
        else sportAdvice = '天气适宜，适合户外运动';

        tips.push({
            icon: '🏃',
            title: '运动指数',
            value: isRain || isSnow ? '不宜' : '适宜',
            desc: sportAdvice
        });

        // 洗车建议
        let carAdvice = '';
        const pop = current.precipProbability || 0;
        if (pop > 60) carAdvice = '降水概率高，不建议洗车';
        else if (pop > 30) carAdvice = '有降水可能，谨慎洗车';
        else carAdvice = '天气良好，适合洗车';

        tips.push({
            icon: '🚗',
            title: '洗车指数',
            value: pop > 60 ? '不宜' : pop > 30 ? '谨慎' : '适宜',
            desc: carAdvice
        });

        // 感冒指数
        let coldAdvice = '';
        const tempDiff = daily0.maxTemp && daily0.minTemp ? (daily0.maxTemp - daily0.minTemp) : 0;
        if (tempDiff > 15) coldAdvice = '昼夜温差大，注意增减衣物';
        else if (current.temp < 10) coldAdvice = '天气寒冷，注意保暖防感冒';
        else if (current.humidity > 80) coldAdvice = '湿度较大，注意防潮';
        else coldAdvice = '天气舒适，感冒概率低';

        tips.push({
            icon: '🤧',
            title: '感冒指数',
            value: tempDiff > 15 || current.temp < 10 ? '易发' : '少发',
            desc: coldAdvice
        });

        // 过敏指数
        let allergyAdvice = '';
        if (current.weather?.includes('花粉') || current.weather?.includes('柳絮')) {
            allergyAdvice = '花粉浓度高，易过敏人群注意防护';
        } else if (current.humidity < 30) {
            allergyAdvice = '空气干燥，注意保湿';
        } else {
            allergyAdvice = '空气质量良好，适宜外出';
        }

        tips.push({
            icon: '🌸',
            title: '过敏指数',
            value: current.weather?.includes('花粉') ? '高' : '低',
            desc: allergyAdvice
        });

        return `
            <div class="glass panel reveal d5 life-tips-section">
                <div class="section-head">
                    <div class="section-title">💡<span>生活建议</span></div>
                </div>
                <div class="life-tips-grid">
                    ${tips.map(tip => `
                        <div class="life-tip-card">
                            <div class="lt-icon">${tip.icon}</div>
                            <div class="lt-title">${tip.title}</div>
                            <div class="lt-value">${tip.value}</div>
                            <div class="lt-desc">${tip.desc}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function renderHourly(hourly) {
        if (!hourly?.length) return '';
        const nowLabel = formatTime(new Date());
        const cards = hourly.slice(0, 24).map((h, i) => {
            const isNow = i === 0 || h.label === nowLabel;
            return `
                <div class="hour-card ${isNow ? 'now' : ''}">
                    <div class="h-time">${isNow ? '现在' : escapeHTML(h.label)}</div>
                    <div class="h-icon">${hourIcon(h)}</div>
                    <div class="h-temp">${Math.round(h.temp)}°</div>
                    <div class="h-pop">${fmtPop(h.precipProbability)}</div>
                </div>
            `;
        }).join('');
        return `
            <div class="glass panel reveal d2">
                <div class="section-head">
                    <div class="section-title">${ICONS.clock}<span>24 小时预报</span></div>
                    <span class="section-action">逐时更新</span>
                </div>
                <div class="hourly-scroll">${cards}</div>
            </div>
        `;
    }

    function renderDaily(daily) {
        if (!daily?.length) return '';
        let minAll = Infinity, maxAll = -Infinity;
        daily.forEach(d => { if (d.minTemp != null) minAll = Math.min(minAll, d.minTemp); if (d.maxTemp != null) maxAll = Math.max(maxAll, d.maxTemp); });
        const range = maxAll - minAll || 1;
        const rows = daily.map((d, i) => {
            const left = d.minTemp != null ? ((d.minTemp - minAll) / range) * 100 : 0;
            const width = d.maxTemp != null && d.minTemp != null ? Math.max(8, ((d.maxTemp - d.minTemp) / range) * 100) : 0;
            const dayName = i === 0 ? '今天' : getWeekday(d.date);
            return `
                <div class="forecast-item">
                    <div class="f-day">${escapeHTML(dayName)}<small>${formatDate(d.date)}</small></div>
                    <div class="f-icon">${dayIcon(d)}</div>
                    <div class="f-desc">
                        <div>${escapeHTML(d.weather || '--')}</div>
                        <div class="f-pop">${fmtPop(d.precipProbability)}</div>
                    </div>
                    <div class="f-temps"><span class="f-temp-low">${Math.round(d.minTemp)}°</span><span class="f-temp-high">${Math.round(d.maxTemp)}°</span></div>
                    <div class="f-bar"><div class="f-bar-fill" style="left:${left}%;width:${width}%"></div></div>
                </div>
            `;
        }).join('');
        return `
            <div class="glass panel reveal d4">
                <div class="section-head">
                    <div class="section-title">${ICONS.calendar}<span>未来 7 天</span></div>
                    <span class="section-action">逐时更新</span>
                </div>
                <div class="forecast-list">${rows}</div>
            </div>
        `;
    }

    function renderWeather(data) {
        const cur = data.current;
        const daily0 = data.daily?.[0] || {};
        const weatherType = cur.weatherCode != null ? wmoType(cur.weatherCode) : getWeatherType(cur.weather);

        // 根据天气数据计算动画强度和风速
        const precip = cur.precipProbability ?? 50;
        const ws = parseFloat(cur.windSpeed) || 0;
        // 强度映射：不同天气类型使用不同指标
        if (weatherType === 'rain' || weatherType === 'storm') {
            animIntensity = Math.min(1, precip / 100);
        } else if (weatherType === 'snow') {
            animIntensity = Math.min(1, precip / 80);
        } else if (weatherType === 'fog' || weatherType === 'haze') {
            const vis = parseFloat(cur.visibility) || 10;
            animIntensity = Math.min(1, Math.max(0.2, 1 - vis / 20));
        } else if (weatherType === 'sunny') {
            const uv = parseFloat(cur.uv) || 5;
            animIntensity = Math.min(1, uv / 11);
        } else if (weatherType === 'cloudy' || weatherType === 'partlyCloudy') {
            const hum = parseInt(cur.humidity) || 50;
            animIntensity = Math.min(1, hum / 100);
        } else {
            animIntensity = 0.5;
        }
        windSpeed = ws;

        setTheme(weatherType);
        startAnimation(weatherType);
        updateMeta(data);

        weatherDisplay.innerHTML = `
            <div class="main-left">
                <div class="current-card glass reveal d1">
                    ${renderCurrentHead(data)}
                    ${renderAQI(cur)}
                    ${renderDetails(cur, daily0)}
                </div>
                ${renderLifeTips(cur, daily0)}
            </div>
            <div class="main-right">
                ${renderSunArc(daily0)}
                ${renderHourly(data.hourly)}
                ${renderDaily(data.daily)}
            </div>
        `;
    }

    function updateMeta(data) {
        const t = formatTime(data.updatedAt);
        updateTime.textContent = t;
        lastUpdateBadge.setAttribute('data-time', t);
    }

    // ===================== 业务逻辑 =====================
    let lastCity = null;
    let isLoading = false;
    let searchDebounceTimer = null;

    async function loadByIP(silent = false) {
        if (isLoading) return;
        isLoading = true;
        showLoading();
        try {
            const loc = await WeatherService.locateIP();
            // locateIP 内部已检测网络类型，复用其结果更新界面
            const isIPv6 = loc._ipv6 || false;
            netBadge.classList.toggle('ipv6', isIPv6);
            netBadge.setAttribute('data-status', isIPv6 ? 'IPv6 已连接' : 'IPv4 网络');
            netText.textContent = isIPv6 ? 'IPv6 已连接' : 'IPv4 网络';
            const data = await WeatherService.getWeather(loc);
            lastCity = loc.city;
            cityInput.value = loc.city;
            renderWeather(data);
            showToast(`已定位到 ${loc.city}`, 'success');
        } catch (e) {
            if (silent) showEmpty();
            else showError(e.message);
            showToast(e.message, 'error');
        } finally {
            isLoading = false;
        }
    }

    async function loadWeather(city) {
        if (!city || isLoading) return;
        isLoading = true;
        clearTimeout(searchDebounceTimer);
        cityInput.value = city;
        historyBox.classList.remove('show');
        cityInput.blur();
        showLoading();
        try {
            const loc = await WeatherService.geocode(city);
            const data = await WeatherService.getWeather(loc);
            lastCity = city;
            renderWeather(data);
            saveHistory(city);
            renderHistory();
        } catch (e) {
            showError(e.message);
            showToast(e.message, 'error');
        } finally {
            isLoading = false;
        }
    }

    window.retryLast = () => {
        if (lastCity) loadWeather(lastCity);
        else loadByIP();
    };

    // ===================== 事件绑定 =====================
    function doSearch() {
        const city = cityInput.value.trim();
        if (!city) return;
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => loadWeather(city), 120);
    }

    btnSearch.addEventListener('click', doSearch);
    cityInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            clearTimeout(searchDebounceTimer);
            const city = cityInput.value.trim();
            if (city) loadWeather(city);
        }
        if (e.key === 'Escape') {
            historyBox.classList.remove('show');
            cityInput.blur();
        }
        if (e.key === '/') {
            const tag = e.target;
            if (tag.selectionStart === 0 && tag.selectionEnd === tag.value.length) {
                // 全选状态下按 / 允许输入
                return;
            }
            if (tag.value === '') {
                e.preventDefault();
                tag.focus();
            }
        }
    });
    cityInput.addEventListener('focus', () => {
        renderHistory();
        cityInput.select();
    });
    // 使用 mousedown 而非 click，避免 blur 先触发导致下拉框消失而无法点击
    cityInput.addEventListener('blur', () => setTimeout(() => historyBox.classList.remove('show'), 200));

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-box')) historyBox.classList.remove('show');
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== cityInput) {
            e.preventDefault();
            cityInput.focus();
        }
    });

    btnRefresh.addEventListener('click', () => {
        btnRefresh.classList.add('spinning');
        const promise = lastCity ? loadWeather(lastCity) : loadByIP();
        promise?.finally(() => setTimeout(() => btnRefresh.classList.remove('spinning'), 600));
    });

    // 随机背景图按钮
    btnRandomBg.addEventListener('click', () => {
        setBgEnabled(!getBgEnabled());
        updateRandomBgToggle();
    });

    historyBox.addEventListener('mousedown', (e) => {
        // 阻止 mousedown 使搜索框失焦，确保下拉项可点击
        if (e.target.closest('.history-item, .history-clear')) {
            e.preventDefault();
        }
    });
    historyBox.addEventListener('click', (e) => {
        const clearBtn = e.target.closest('.history-clear');
        if (clearBtn) {
            e.stopPropagation();
            clearHistory();
            return;
        }
        const removeBtn = e.target.closest('.h-remove');
        if (removeBtn) {
            e.stopPropagation();
            removeHistory(removeBtn.dataset.city);
            return;
        }
        const item = e.target.closest('.history-item');
        if (item) loadWeather(item.dataset.city);
    });
    historyBox.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const item = e.target.closest('.history-item');
            if (item) loadWeather(item.dataset.city);
        }
    });

    weatherDisplay.addEventListener('click', (e) => {
        const cityBtn = e.target.closest('.quick-city');
        if (cityBtn) loadWeather(cityBtn.dataset.city);
    });

    // ===================== 小时预报滚动增强 =====================
    // 鼠标滚轮横向滚动（桌面端）
    weatherDisplay.addEventListener('wheel', (e) => {
        const scrollContainer = e.target.closest('.hourly-scroll');
        if (scrollContainer && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
            e.preventDefault();
            scrollContainer.scrollLeft += e.deltaY;
        }
    }, { passive: false });

    // 拖拽滚动（桌面端）
    (function initDragScroll() {
        let isDown = false, startX, scrollLeft;
        const getScrollContainer = () => document.querySelector('.hourly-scroll');

        weatherDisplay.addEventListener('mousedown', (e) => {
            const container = e.target.closest('.hourly-scroll');
            if (!container) return;
            isDown = true;
            startX = e.pageX - container.offsetLeft;
            scrollLeft = container.scrollLeft;
            container.classList.add('dragging');
        });

        document.addEventListener('mouseleave', () => { isDown = false; });
        document.addEventListener('mouseup', () => {
            isDown = false;
            getScrollContainer()?.classList.remove('dragging');
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            const container = getScrollContainer();
            if (!container) return;
            e.preventDefault();
            const x = e.pageX - container.offsetLeft;
            const walk = (x - startX) * 1.5;
            container.scrollLeft = scrollLeft - walk;
        });
    })();

    // ===================== 初始化 =====================
    (async function init() {
        renderHistory();
        updateRandomBgToggle();
        showEmpty();
        // 尝试自动定位（网络检测在 loadByIP 中并行执行）
        try { await loadByIP(true); }
        catch (e) { console.log('自动定位未成功', e.message); }
    })();
</script>
</body>
</html>
